<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL SPA Tools｜資料關聯探索器</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
*{box-sizing:border-box}

html,body{margin:0;height:100%;background:var(--theme-page);color:var(--theme-text);font:13px/1.5 var(--theme-font-sans)}
button{font:inherit;color:var(--theme-text);background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--theme-primary)}
button.primary{background:var(--theme-primary);color:var(--theme-surface);border-color:var(--theme-primary)}
button.danger{color:var(--theme-danger);background:var(--theme-danger-soft);border-color:var(--theme-danger)}
button.sm{padding:1px 7px;font-size:12px}
button:disabled{opacity:.65;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--theme-primary);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--theme-text);background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:6px;padding:4px 6px}
input[type=checkbox]{vertical-align:middle}
textarea{width:100%}
.topbar{height:50px;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--theme-surface);border-bottom:1px solid var(--theme-border);box-shadow:var(--theme-shadow);position:relative;z-index:5}
.brand{font-weight:700;font-size:15px;margin:0 6px 0 0;white-space:nowrap}
.topbar .brand{color:var(--theme-text)!important}
.ver{font-size:11px;background:var(--theme-primary);color:var(--theme-surface);border-radius:4px;padding:0 5px;margin-left:4px}
.sep{flex:1}
.topbar label{white-space:nowrap}
#thresholdInput{width:56px}
#wsSelect{max-width:180px}
.dropdown{position:relative}
.menu{display:none;position:absolute;right:0;top:110%;background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:8px;box-shadow:var(--theme-shadow);min-width:230px;padding:4px;z-index:20}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:6px 10px}
.menu button:hover{background:var(--theme-surface-soft)}
.menu hr{border:none;border-top:1px solid var(--theme-border);margin:4px 0}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 370px;height:calc(100% - 50px)}
.layout.nodetail{grid-template-columns:230px minmax(0,1fr) 0}
.sidebar{border-right:1px solid var(--theme-border);background:var(--theme-surface);display:flex;flex-direction:column;min-height:0}
.side-head{padding:10px 12px;font-weight:700;border-bottom:1px solid var(--theme-border);display:flex;justify-content:space-between;align-items:center}
#tableList{flex:1;overflow:auto;padding:6px}
.titem{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;cursor:pointer}
.titem:hover{background:var(--theme-surface-soft)}
.titem.active{background:var(--theme-surface-soft);font-weight:600}
.titem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .meta{color:var(--theme-muted);font-size:11px}
.titem .ops{display:none;gap:2px}.titem:hover .ops{display:inline-flex}
.titem .ops button{padding:0 4px;border:none;background:none}
.progress-box{border-top:1px solid var(--theme-border);padding:10px}
.pbar{height:6px;background:var(--theme-border);border-radius:3px;overflow:hidden}
#pbarFill{height:100%;width:0;background:var(--theme-primary);transition:width .2s}
#pmsg{font-size:12px;color:var(--theme-muted);margin:4px 0;word-break:break-all}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;padding:4px 10px 0;border-bottom:1px solid var(--theme-border);background:var(--theme-surface);overflow-x:auto;flex-shrink:0}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 11px}
.tabs button.active{border-bottom-color:var(--theme-primary);color:var(--theme-primary);font-weight:700}
.view{flex:1;overflow:auto;padding:14px;min-height:0}
.view.full{padding:0;overflow:hidden;display:flex;flex-direction:column}
.detail{border-left:1px solid var(--theme-border);background:var(--theme-surface);overflow:auto;min-width:0}
.nodetail .detail{display:none}
.detail-head{position:sticky;top:0;background:var(--theme-surface);padding:10px 12px;font-weight:700;border-bottom:1px solid var(--theme-border);display:flex;justify-content:space-between;align-items:center;z-index:2}
#detailBody{padding:12px}
#detailBody h3{margin:0 0 8px;font-size:15px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:10px;padding:10px 12px;box-shadow:var(--theme-shadow)}
.card .k{color:var(--theme-muted);font-size:12px}.card .v{font-size:22px;font-weight:700}
.box{background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:10px;padding:12px;margin-bottom:14px;box-shadow:var(--theme-shadow)}
.box h3{margin:0 0 8px;font-size:14px}
.tblwrap{overflow:auto;max-height:65vh}
table.grid{border-collapse:collapse;width:100%;font-size:12px}
table.grid th,table.grid td{border-bottom:1px solid var(--theme-border);padding:5px 8px;text-align:left;vertical-align:top}
table.grid th{position:sticky;top:0;background:var(--theme-surface-alt);font-weight:600;z-index:1;white-space:nowrap}
table.grid tr.click{cursor:pointer}
table.grid tr.click:hover td{background:var(--theme-surface-soft)}
table.grid tr.sel td{background:var(--theme-surface-soft)}
table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid tr.dim td{opacity:.5}
.tag{display:inline-block;padding:0 6px;border-radius:10px;font-size:11px;border:1px solid var(--theme-border);white-space:nowrap;margin:1px 2px 1px 0}
.tag.ok{color:var(--theme-success);border-color:var(--theme-success)}.tag.bad{color:var(--theme-danger);border-color:var(--theme-danger)}.tag.warn{color:var(--theme-warning);border-color:var(--theme-warning)}.tag.acc{color:var(--theme-primary);border-color:var(--theme-primary)}.tag.pk{color:var(--theme-info);border-color:var(--theme-info)}
.muted{color:var(--theme-muted)}
.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.barbg{background:var(--theme-border);border-radius:4px;height:8px;min-width:60px;overflow:hidden}
.barfg{height:8px;background:var(--theme-primary);border-radius:4px}
.mono{font-family:var(--theme-font-mono)}
pre.code{font-family:var(--theme-font-mono);background:var(--theme-surface-alt);border:1px solid var(--theme-border);border-radius:8px;padding:10px;overflow:auto;max-height:55vh;font-size:12px;white-space:pre;margin:0}
.empty{padding:50px 20px;text-align:center;color:var(--theme-muted)}
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--theme-text) 45%,transparent);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--theme-surface);border-radius:12px;width:min(580px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--theme-shadow)}
.modal.wide{width:min(1150px,96vw)}
.modal-h{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--theme-border);display:flex;justify-content:space-between;align-items:center}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{padding:10px 16px;border-top:1px solid var(--theme-border);display:flex;justify-content:flex-end;gap:8px}
.form-grid{display:grid;grid-template-columns:200px 1fr;gap:8px 12px;align-items:center}
.form-grid .hint{grid-column:2;color:var(--theme-muted);font-size:11px;margin-top:-6px}
.drop{border:2px dashed var(--theme-border);border-radius:10px;padding:20px;text-align:center;color:var(--theme-muted);cursor:pointer;margin-bottom:12px}
.drop.over{border-color:var(--theme-primary);background:var(--theme-surface-soft)}
.flist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.flist button.active{background:var(--theme-surface-soft);border-color:var(--theme-primary);font-weight:600}
.preview{max-height:40vh;overflow:auto;border:1px solid var(--theme-border);border-radius:8px;margin-top:10px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--theme-text);color:var(--theme-surface);padding:8px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:80vw}
#toast.show{opacity:.95}
.er-tool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--theme-border);background:var(--theme-surface)}
.er-wrap{flex:1;position:relative;overflow:hidden;background:var(--theme-surface-alt);min-height:300px}
#erSvg{width:100%;height:100%;display:block;cursor:grab;user-select:none;touch-action:none}
#erSvg .ernode{cursor:move}
#erSvg .eredge{cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;background:var(--theme-surface);border:1px solid var(--theme-border);border-radius:8px;padding:6px 10px;font-size:11px;line-height:1.7}
.legend i{display:inline-block;width:26px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:12px;margin-bottom:10px}
.kv>div:nth-child(odd){color:var(--theme-muted)}
.kv>div{word-break:break-all}
.pathc{border:1px solid var(--theme-border);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--theme-surface)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0}
.chip{background:var(--theme-surface-soft);border-radius:6px;padding:1px 8px;font-weight:600}
.arrow{color:var(--theme-muted);font-size:11px}
.lvl{padding:3px 0 3px calc(var(--d) * 20px)}
h4{margin:12px 0 6px;font-size:13px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1300px){.layout{grid-template-columns:200px minmax(0,1fr) 320px}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <h1 class="brand">SQL SPA Tools｜資料關聯探索器</h1>
  <select id="wsSelect" data-chg="ws" title="切換工作區"></select>
  <button data-act="ws-new" title="新增工作區">＋</button>
  <button data-act="ws-rename" title="重新命名工作區">✏️</button>
  <button data-act="ws-delete" class="danger" title="刪除工作區">🗑</button>
  <span class="sep"></span>
  <button data-act="import" class="primary">📥 匯入</button>
  <button data-act="analyze" class="primary" id="btnAnalyze">⚙️ 分析</button>
  <div class="dropdown">
    <button data-act="toggle-export">📤 匯出 ▾</button>
    <div class="menu" id="exportMenu">
      <button data-act="exp-mermaid">Mermaid erDiagram</button>
      <button data-act="exp-ddl">SQL DDL（Oracle / SQL Server / SQLite）</button>
      <button data-act="exp-excel">Excel 分析報告（.xls）</button>
      <button data-act="exp-md">Markdown 關聯說明文件</button>
      <button data-act="exp-svg">ER 圖 SVG</button>
      <button data-act="exp-png">ER 圖 PNG</button>
      <button data-act="exp-report">📑 一鍵產生分析報告（HTML）</button>
      <hr>
      <button data-act="exp-json">匯出工作區 JSON</button>
      <button data-act="imp-json">匯入工作區 JSON</button>
      <hr>
      <button data-act="load-sample">載入範例資料（放款系統）</button>
    </div>
  </div>
  <label>門檻 <input type="number" id="thresholdInput" min="0" max="100" step="5" value="70" title="信心分數門檻"></label>
  <button data-act="settings" title="分析設定">⚙ 設定</button>
  <button data-act="theme" id="btnTheme" title="切換主題">☾</button>
</header>
<a class="home-link" href="index.html">⌂ 工具入口</a>
<button id="themeToggle" class="theme-toggle" type="button">切換主題</button>
<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="side-head"><span>資料表 <span id="tblCount" class="muted"></span></span><span class="muted small" title="勾選＝在 ER 圖顯示">ER</span></div>
    <div id="tableList"></div>
    <div class="progress-box">
      <div class="pbar"><div id="pbarFill"></div></div>
      <div id="pmsg">尚未分析</div>
      <button data-act="cancel" id="btnCancel" class="sm danger" hidden>取消分析</button>
    </div>
  </aside>
  <main class="main">
    <nav class="tabs" id="tabs"></nav>
    <section id="view" class="view"></section>
  </main>
  <aside class="detail" id="detail">
    <div class="detail-head"><span>詳細資訊</span><button class="sm" data-act="close-detail">✕</button></div>
    <div id="detailBody"><div class="muted">點選欄位、關聯、相依或資料表，即可在此查看詳細資訊。</div></div>
  </aside>
</div>
<div id="modalRoot"></div>
<input type="file" id="fileInput" multiple accept=".csv,.tsv,.txt" hidden>
<input type="file" id="wsFileInput" accept=".json" hidden>
<div id="toast"></div>
<script type="text/js-worker" id="workerSrc">
'use strict';
/* ===== 分析引擎（Web Worker） ===== */
self.onmessage = function (e) {
  const m = e.data;
  if (m.type === 'analyze') {
    try {
      const t0 = Date.now();
      const r = analyze(m.payload);
      r.ms = Date.now() - t0;
      self.postMessage({ type: 'done', result: r });
    } catch (err) {
      self.postMessage({ type: 'error', message: String((err && err.stack) || err) });
    }
  }
};
let lastP = 0;
function P(p, msg) {
  const now = Date.now();
  if (now - lastP < 100 && p < 100) return;
  lastP = now;
  self.postMessage({ type: 'progress', p: Math.min(100, Math.round(p)), msg: msg });
}

const RE_INT = /^[+-]?\d+$/;
const RE_DEC = /^[+-]?(?:\d+|\d{1,3}(?:,\d{3})+)?\.\d+$|^[+-]?\d{1,3}(?:,\d{3})+$/;
const RE_CJK = /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF]/;
const KEYISH = /(^|_)(ID|NO|CODE|CD|KEY|SEQ)$|(ID|NO)$|帳號|編號|代號|代碼|序號|統編|鍵|號碼$|分行別|分號/i;
const FKBAD = new Set(['decimal', 'dateAD', 'dateROC', 'empty']);

function validMD(y, m, d) {
  if (m < 1 || m > 12 || d < 1) return false;
  const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  return d <= [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
}
const pad2 = n => (n < 10 ? '0' : '') + n;
function parseAD(v) {
  const m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[ T]\d{1,2}:\d{2}(?::\d{2}(?:\.\d+)?)?)?$/.exec(v) || /^(\d{4})(\d{2})(\d{2})$/.exec(v);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (y < 1900 || y > 2100 || !validMD(y, mo, d)) return null;
  return y + '-' + pad2(mo) + '-' + pad2(d);
}
function parseROC(v) {
  const m = /^(\d{2,3})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(v) || /^(\d{3})(\d{2})(\d{2})$/.exec(v);
  if (!m) return null;
  const y = +m[1];
  if (y < 1 || y > 200) return null;
  const Y = y + 1911, mo = +m[2], d = +m[3];
  if (!validMD(Y, mo, d)) return null;
  return Y + '-' + pad2(mo) + '-' + pad2(d);
}
function sig(v) {
  let s = '';
  const L = Math.min(v.length, 40);
  for (let i = 0; i < L; i++) {
    const c = v.charCodeAt(i);
    if (c >= 48 && c <= 57) s += '9';
    else if ((c >= 65 && c <= 90) || (c >= 97 && c <= 122)) s += 'A';
    else if (c >= 0x2E80) s += '中';
    else if (c === 32) s += '_';
    else s += v[i];
  }
  if (v.length > 40) s += '…';
  return s;
}
function descSig(s) {
  if (/^9+$/.test(s)) return '固定' + s.length + '碼數字';
  if (/^A+$/.test(s)) return '固定' + s.length + '碼英文';
  const m = /^(A+)(9+)$/.exec(s);
  if (m) return m[1].length + '碼英文＋' + m[2].length + '碼數字';
  if (/^中+$/.test(s)) return '固定' + s.length + '字中文';
  return '格式 ' + s;
}
function topN(freq, k) {
  const a = [];
  for (const [v, c] of freq) {
    if (a.length < k) {
      a.push([v, c]);
      if (a.length === k) a.sort((x, y) => y[1] - x[1]);
    } else if (c > a[k - 1][1]) {
      a[k - 1] = [v, c];
      let i = k - 1;
      while (i > 0 && a[i][1] > a[i - 1][1]) { const t = a[i]; a[i] = a[i - 1]; a[i - 1] = t; i--; }
    }
  }
  if (a.length < k) a.sort((x, y) => y[1] - x[1]);
  return a;
}

/* ---------- 欄位剖析 ---------- */
function profileCol(vals, st) {
  const n = vals.length;
  let nulls = 0, minL = Infinity, maxL = 0;
  const freq = new Map();
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    if (v === null) { nulls++; continue; }
    const L = v.length;
    if (L < minL) minL = L;
    if (L > maxL) maxL = L;
    freq.set(v, (freq.get(v) || 0) + 1);
  }
  const nonNull = n - nulls, distinct = freq.size;
  let cInt = 0, cLead = 0, cDec = 0, cAD = 0, cROC = 0, cCJK = 0;
  const pat = new Map();
  for (const [v, c] of freq) {
    const s = sig(v);
    pat.set(s, (pat.get(s) || 0) + c);
    if (RE_CJK.test(v)) cCJK += c;
    if (RE_INT.test(v)) {
      if (v.replace(/^[+-]/, '').length > 1 && /^[+-]?0/.test(v)) cLead += c; else cInt += c;
    } else if (RE_DEC.test(v)) cDec += c;
    if (parseAD(v)) cAD += c;
    else if (st.rocDate && parseROC(v)) cROC += c;
  }
  const th = nonNull * 0.98;
  let type;
  if (!nonNull) type = 'empty';
  else if (cAD >= th) type = 'dateAD';
  else if (cROC >= th) type = 'dateROC';
  else if (cInt >= th) type = 'int';
  else if (cInt + cDec >= th) type = 'decimal';
  else if (cInt + cLead >= th) type = 'digits';
  else if (maxL <= 12 && cCJK < nonNull * 0.5 && (distinct <= 50 || distinct / nonNull <= 0.05)) type = 'code';
  else type = 'text';

  let numMin = null, numMax = null, maxScale = 0, maxIntD = 0, dMin = null, dMax = null;
  const rocSample = [];
  if (type === 'int' || type === 'decimal') {
    for (const v of freq.keys()) {
      const s = v.replace(/,/g, '');
      const f = parseFloat(s);
      if (isNaN(f)) continue;
      if (numMin === null || f < numMin) numMin = f;
      if (numMax === null || f > numMax) numMax = f;
      const p = s.replace(/^[+-]/, '').split('.');
      if (p[0].length > maxIntD) maxIntD = p[0].length;
      if (p[1] && p[1].length > maxScale) maxScale = p[1].length;
    }
  }
  if (type === 'dateAD' || type === 'dateROC') {
    const fn = type === 'dateAD' ? parseAD : parseROC;
    for (const v of freq.keys()) {
      const d = fn(v);
      if (!d) continue;
      if (!dMin || d < dMin) dMin = d;
      if (!dMax || d > dMax) dMax = d;
      if (type === 'dateROC' && rocSample.length < 5) rocSample.push([v, d]);
    }
  }
  const pats = topN(pat, 5);
  const topPat = pats[0] ? pats[0][0] : '';
  const patShare = nonNull && pats[0] ? pats[0][1] / nonNull : 0;
  let patternDesc;
  if (!nonNull) patternDesc = '—';
  else if (patShare >= 0.95) patternDesc = descSig(topPat);
  else if (type === 'int' || type === 'digits') patternDesc = minL === maxL ? '固定' + minL + '碼數字' : minL + '～' + maxL + '碼數字';
  else patternDesc = '混合格式';
  let cls = 'mixed';
  if (type === 'int' || type === 'digits') cls = 'digit';
  else if (/^[A9]+$/.test(topPat) && patShare >= 0.9) cls = 'alnum';
  else if (cCJK >= nonNull * 0.9 && nonNull) cls = 'cjk';
  const isEnum = distinct >= 2 && distinct <= 30 && nonNull >= 20 && distinct / nonNull <= 0.2;
  return {
    _freq: freq, rows: n, nulls, nonNull, nullRate: n ? nulls / n : 0, distinct,
    uniqueRate: nonNull ? distinct / nonNull : 0, minLen: nonNull ? minL : 0, maxLen: maxL, type,
    pattern: topPat, patShare, patternDesc, patterns: pats, cls, hasCJK: cCJK > 0,
    top10: topN(freq, 10).map(([v, c]) => [v.length > 80 ? v.slice(0, 80) + '…' : v, c]),
    isEnum, numMin, numMax, maxScale, maxIntD, dMin, dMax, rocSample
  };
}

/* ---------- 工具 ---------- */
function randIdx(n, k) {
  const a = new Uint32Array(n);
  for (let i = 0; i < n; i++) a[i] = i;
  if (k >= n) return a;
  for (let i = 0; i < k; i++) {
    const j = i + Math.floor(Math.random() * (n - i));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a.slice(0, k).sort();
}
function combos(pool, k, cb) {
  const c = [];
  let stop = false;
  (function rec(s) {
    if (stop) return;
    if (c.length === k) { if (cb(c) === 'stop') stop = true; return; }
    for (let i = s; i < pool.length && !stop; i++) { c.push(pool[i]); rec(i + 1); c.pop(); }
  })(0);
}
function lev(a, b) {
  a = a.slice(0, 40); b = b.slice(0, 40);
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const normName = s => String(s).toUpperCase().replace(/[\s_\-.()\[\]]/g, '');
const stripAff = s => s.replace(/^(FK|PK|REF|SRC|TGT)/, '').replace(/(ID|NO|CODE|CD|KEY|NUM|NBR)$/, '');
function nameSim(a, b, tgtTable) {
  const A = normName(a), B = normName(b);
  if (!A || !B) return 0;
  if (A === B) return 1;
  const T = normName(tgtTable || '');
  if (T && (A === T + B || A === T + stripAff(B) || stripAff(A) === T)) return 0.9;
  const As = stripAff(A), Bs = stripAff(B);
  if (As && As === Bs) return 0.85;
  const mx = Math.max(A.length, B.length), mn = Math.min(A.length, B.length);
  if (A.includes(B) || B.includes(A)) return 0.5 + 0.35 * mn / mx;
  return Math.max(0, 1 - lev(A, B) / mx);
}
function typeCompat(a, b) {
  if (FKBAD.has(a.type) || FKBAD.has(b.type)) return (a.type === b.type && (a.type === 'dateAD' || a.type === 'dateROC')) ? 1 : 0;
  if (a.type === b.type) return 1;
  return 0.5;
}
function patMatch(a, b) {
  if (a.patShare >= 0.9 && b.patShare >= 0.9 && a.pattern === b.pattern) return 1;
  if (a.cls === b.cls && a.cls !== 'mixed') return 0.5;
  return 0;
}
const FKOK = p => p.nonNull > 0 && !FKBAD.has(p.type) && p.maxLen <= 60;
function inclusion(a, b, minIncl) {
  if (!a.size) return 0;
  let miss = 0;
  const maxMiss = a.size * (1 - minIncl);
  for (const k of a.keys()) if (!b.has(k)) { miss++; if (miss > maxMiss) return 0; }
  return (a.size - miss) / a.size;
}
function orphanList(src, tgt) {
  let d = 0, r = 0;
  const list = [];
  for (const [v, c] of src) {
    if (!tgt.has(v)) { d++; r += c; if (list.length < 3000) list.push([v.replace(/\u0001/g, ' | '), c]); }
  }
  list.sort((a, b) => b[1] - a[1]);
  return { d, r, list: list.slice(0, 300) };
}
function tupleFreq(cols, idxs, n) {
  const m = new Map();
  let nullRows = 0;
  for (let i = 0; i < n; i++) {
    let k = '', bad = false;
    for (let q = 0; q < idxs.length; q++) {
      const v = cols[idxs[q]][i];
      if (v === null) { bad = true; break; }
      k += (q ? '\u0001' : '') + v;
    }
    if (bad) { nullRows++; continue; }
    m.set(k, (m.get(k) || 0) + 1);
  }
  m.nullRows = nullRows;
  return m;
}
function isUniqueTuple(cols, combo, idx, n) {
  const s = new Set();
  const L = idx ? idx.length : n;
  for (let j = 0; j < L; j++) {
    const i = idx ? idx[j] : j;
    let k = cols[combo[0]][i];
    if (k === null) return false;
    for (let q = 1; q < combo.length; q++) {
      const v = cols[combo[q]][i];
      if (v === null) return false;
      k += '\u0001' + v;
    }
    if (s.has(k)) return false;
    s.add(k);
  }
  return true;
}

/* ---------- 主鍵候選 ---------- */
const AMTISH = /金額|餘額|額度|利率|利息|費用|價格|數量|AMT|BAL|RATE|PRICE|QTY/i;
function mkPK(t, combo) {
  const ps = combo.map(i => t.profs[i]);
  let s = 100 - (combo.length - 1) * 15;
  ps.forEach(p => {
    const k = KEYISH.test(p.col);
    if (combo.length > 1) s += k ? 6 : -8; else if (k) s += 8;
    if (AMTISH.test(p.col) || (p.type === 'int' && p.minLen !== p.maxLen && !k)) s -= 20;
  });
  if (ps.every(p => p.minLen === p.maxLen)) s += 5;
  if (ps.some(p => p.maxLen > 30)) s -= 15;
  if (ps.some(p => p.type === 'dateAD' || p.type === 'dateROC' || p.type === 'decimal')) s -= 12;
  if (ps.some(p => p.cls === 'cjk')) s -= 12;
  s = Math.max(1, Math.min(100, Math.round(s)));
  return { cols: ps.map(p => p.col), idxs: combo.slice(), score: s };
}
function findPK(t, st) {
  const out = [], n = t.n;
  if (!n) return out;
  const singles = new Set();
  t.profs.forEach(p => { if (p.nulls === 0 && p.distinct === n) { singles.add(p.idx); out.push(mkPK(t, [p.idx])); } });
  const maxK = Math.min(3, st.maxComposite || 3);
  if (maxK >= 2) {
    const pool = t.profs.filter(p => p.nulls === 0 && !singles.has(p.idx) && p.distinct > 1 && p.type !== 'decimal' && p.maxLen <= 50)
      .sort((a, b) => b.distinct - a.distinct).slice(0, st.topK || 12).map(p => p.idx).sort((a, b) => a - b);
    const sampleIdx = n > st.sampleThreshold ? randIdx(n, st.sampleSize) : null;
    const found = [];
    for (let k = 2; k <= maxK; k++) {
      combos(pool, k, combo => {
        if (found.some(f => f.every(x => combo.includes(x)))) return;
        let prod = 1;
        for (const c of combo) { prod *= t.profs[c].distinct; if (prod >= n) break; }
        if (prod < n) return;
        if (sampleIdx && !isUniqueTuple(t.cols, combo, sampleIdx, n)) return;
        if (!isUniqueTuple(t.cols, combo, null, n)) return;
        found.push(combo.slice());
        out.push(mkPK(t, combo));
        if (out.length > 40) return 'stop';
      });
    }
  }
  out.sort((a, b) => b.score - a.score || a.cols.length - b.cols.length);
  return out.slice(0, 15);
}

/* ---------- 欄位相依 ---------- */
function encode(vals) {
  const n = vals.length, codes = new Int32Array(n), map = new Map(), back = [null];
  for (let i = 0; i < n; i++) {
    const v = vals[i];
    if (v === null) continue;
    let c = map.get(v);
    if (c === undefined) { c = back.length; map.set(v, c); back.push(v); }
    codes[i] = c;
  }
  return { codes, D: back.length, back };
}
function fdViol(L, R, idx, n) {
  const cnt = idx ? idx.length : n, RD = R.D;
  const gT = new Int32Array(L.D), gM = new Int32Array(L.D);
  if (L.D * RD <= Math.min(1e6, cnt * 4)) {
    const arr = new Int32Array(L.D * RD);
    for (let j = 0; j < cnt; j++) {
      const i = idx ? idx[j] : j, l = L.codes[i];
      const v = ++arr[l * RD + R.codes[i]];
      gT[l]++;
      if (v > gM[l]) gM[l] = v;
    }
  } else {
    const m = new Map();
    for (let j = 0; j < cnt; j++) {
      const i = idx ? idx[j] : j, l = L.codes[i], k = l * RD + R.codes[i];
      const v = (m.get(k) || 0) + 1;
      m.set(k, v);
      gT[l]++;
      if (v > gM[l]) gM[l] = v;
    }
  }
  let viol = 0;
  for (let l = 0; l < L.D; l++) viol += gT[l] - gM[l];
  return { viol, cnt, gT, gM };
}
function fdSamples(L, R, gT, gM, n) {
  const bad = [];
  for (let l = 0; l < L.D && bad.length < 20; l++) if (gT[l] > gM[l]) bad.push(l);
  const set = new Map(bad.map(l => [l, new Map()]));
  for (let i = 0; i < n; i++) {
    const m = set.get(L.codes[i]);
    if (m) { const r = R.codes[i]; m.set(r, (m.get(r) || 0) + 1); }
  }
  return bad.map(l => ({
    lhs: L.back[l] == null ? '(空值)' : L.back[l],
    rhs: [...set.get(l)].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([r, c]) => [R.back[r] == null ? '(空值)' : R.back[r], c])
  }));
}
const codeLike = p => p.maxLen <= 10 && !p.hasCJK && (p.type === 'code' || p.type === 'digits' || p.type === 'int' || p.cls === 'alnum');
function fdTable(t, st, dicts) {
  const n = t.n, res = [];
  if (n < 3) return res;
  let cand = t.profs.filter(p => p.distinct >= 2 && !(p.distinct === n && p.nulls === 0) && p.type !== 'empty');
  if (cand.length > st.fdMaxCols) cand = cand.slice(0, st.fdMaxCols);
  const enc = cand.map(p => encode(t.cols[p.idx]));
  const sIdx = n > 20000 ? randIdx(n, 20000) : null;
  outer:
  for (let i = 0; i < cand.length; i++) {
    const a = cand[i];
    if (a.distinct > n * st.fdMaxLhsRatio) continue;
    for (let j = 0; j < cand.length; j++) {
      if (i === j) continue;
      const b = cand[j];
      if (b.distinct - a.distinct > n * st.fdMax) continue;
      if (sIdx) {
        const s = fdViol(enc[i], enc[j], sIdx, n);
        if (s.viol / s.cnt > st.fdMax * 2 + 0.001) continue;
      }
      const f = fdViol(enc[i], enc[j], null, n);
      const rate = f.viol / n;
      if (rate > st.fdMax) continue;
      res.push({
        tableId: t.id, lhs: a.col, rhs: b.col, violRows: f.viol, violRate: rate, exact: f.viol === 0,
        lhsDistinct: a.distinct, rhsDistinct: b.distinct,
        samples: f.viol ? fdSamples(enc[i], enc[j], f.gT, f.gM, n) : [], _i: i, _j: j
      });
      if (res.length >= 300) break outer;
    }
  }
  const keys = new Set(res.map(r => r.lhs + '\u0001' + r.rhs));
  res.forEach(r => { r.bijection = keys.has(r.rhs + '\u0001' + r.lhs); });
  res.forEach(r => {
    if (!r.bijection) return;
    const a = cand[r._i], b = cand[r._j];
    if (codeLike(a) && (b.hasCJK || (!codeLike(b) && b.maxLen > a.maxLen))) {
      const L = enc[r._i], R = enc[r._j], seen = new Map();
      for (let i = 0; i < n && seen.size < 15; i++) { const l = L.codes[i]; if (l && !seen.has(l)) seen.set(l, R.codes[i]); }
      dicts.push({ tableId: t.id, codeCol: a.col, nameCol: b.col, entries: a.distinct, exact: r.exact && !r.violRows,
        sample: [...seen].map(([l, rr]) => [L.back[l], R.back[rr] == null ? '' : R.back[rr]]) });
    }
  });
  res.forEach(r => { delete r._i; delete r._j; });
  return res;
}

/* ---------- 主流程 ---------- */
function analyze(P0) {
  const st = P0.settings;
  const nullSet = new Set(st.nullTokens || []);
  const trim = st.trim !== false, blankNull = st.blankAsNull !== false;
  const norm = v => {
    if (v === undefined || v === null) return null;
    let s = String(v);
    if (trim) s = s.trim();
    else if (blankNull && s.trim() === '') return null;
    if (s === '' && blankNull) return null;
    if (nullSet.has(s)) return null;
    return s;
  };
  const N = P0.tables.length;
  const T = [];
  P0.tables.forEach((t, ti) => {
    let rows = t.rows, sampled = false;
    const origN = rows.length;
    if (st.sampling && rows.length > st.fullLimit) {
      const idx = randIdx(rows.length, st.fullLimit);
      rows = Array.from(idx, i => t.rows[i]);
      sampled = true;
    }
    const cols = t.cols.map((c, ci) => {
      const a = new Array(rows.length);
      for (let i = 0; i < rows.length; i++) a[i] = norm(rows[i][ci]);
      return a;
    });
    t.rows = null;
    const profs = [], freqs = [];
    cols.forEach((vals, ci) => {
      const r = profileCol(vals, st);
      r.col = t.cols[ci];
      r.idx = ci;
      freqs.push(r._freq);
      delete r._freq;
      profs.push(r);
    });
    T.push({ id: t.id, name: t.name, colNames: t.cols, n: rows.length, origN, sampled, cols, profs, freqs });
    P(30 * (ti + 1) / N, '欄位剖析：' + t.name);
  });

  // 主鍵
  T.forEach((t, ti) => {
    t.pkCands = findPK(t, st);
    const man = P0.manualPK[t.id], rej = P0.rejectedPK[t.id] || [];
    if (man && man.length) t.effPK = man;
    else { const c = t.pkCands.find(c => !rej.includes(c.cols.join(','))); t.effPK = c ? c.cols : []; }
    t.compKeys = t.pkCands.filter(c => c.cols.length >= 2 && !rej.includes(c.cols.join(','))).slice(0, 3).map(c => c.cols);
    if (man && man.length >= 2 && !t.compKeys.some(k => k.join(',') === man.join(','))) t.compKeys.unshift(man);
    P(30 + 15 * (ti + 1) / N, '主鍵分析：' + t.name);
  });

  // 單欄外鍵
  const targets = [], sources = [];
  T.forEach(t => t.profs.forEach(p => {
    if (!FKOK(p)) return;
    if (p.distinct >= 2 && p.distinct / p.nonNull >= st.fkTargetMinUnique)
      targets.push({ t, p, set: t.freqs[p.idx], isPK: t.effPK.length === 1 && t.effPK[0] === p.col });
    if (p.distinct >= st.fkMinDistinct) sources.push({ t, p, set: t.freqs[p.idx] });
  }));
  const rels = [];
  sources.forEach((s, si) => {
    const cand = [];
    for (const g of targets) {
      if (s.t === g.t && s.p.idx === g.p.idx) continue;
      const tc = typeCompat(s.p, g.p);
      if (!tc) continue;
      if (s.p.minLen > g.p.maxLen || s.p.maxLen < g.p.minLen) continue;
      if (s.p.distinct * st.fkMinIncl > g.p.distinct) continue;
      const inc = inclusion(s.set, g.set, st.fkMinIncl);
      if (inc < st.fkMinIncl) continue;
      const ns = nameSim(s.p.col, g.p.col, g.t.name), pm = patMatch(s.p, g.p);
      let score = inc * 45 + ns * 20 + tc * 15 + pm * 10 + (g.isPK ? 10 : 0);
      if (s.p.distinct < 10) score *= 0.75;
      if (ns < 0.3) score -= 10;
      if (s.t === g.t) score -= 5;
      if (score < st.keepScore) continue;
      cand.push({ g, inc, ns, tc, pm, score });
    }
    cand.sort((a, b) => b.score - a.score);
    cand.slice(0, 3).forEach(c => {
      const o = orphanList(s.set, c.g.set);
      const srcU = s.p.distinct === s.p.nonNull, tgtU = c.g.p.distinct === c.g.p.nonNull;
      rels.push({
        key: s.t.id + '|' + s.p.col + '|' + c.g.t.id + '|' + c.g.p.col,
        srcTable: s.t.id, srcCols: [s.p.col], tgtTable: c.g.t.id, tgtCols: [c.g.p.col],
        score: Math.max(0, Math.min(100, Math.round(c.score))), incl: c.inc, nameSim: c.ns, typeMatch: c.tc, patMatch: c.pm,
        tgtIsPK: c.g.isPK, card: tgtU ? (srcU ? '1:1' : '1:N') : 'N:M', srcOptional: s.p.nulls > 0,
        orphanDistinct: o.d, orphanRows: o.r, orphans: o.list, srcNonNull: s.p.nonNull, kind: 'single'
      });
    });
    if (si % 10 === 0) P(45 + 30 * (si + 1) / sources.length, '外鍵分析：' + s.t.name + '.' + s.p.col);
  });
  const relsOut = rels;
  // 複合外鍵
  T.forEach((B, bi) => {
    B.compKeys.forEach(kc => {
      const bIdx = kc.map(c => B.colNames.indexOf(c));
      if (bIdx.some(i => i < 0)) return;
      const tgtSet = tupleFreq(B.cols, bIdx, B.n);
      const tgtU = tgtSet.size === B.n - tgtSet.nullRows;
      T.forEach(A => {
        if (A === B) return;
        const options = bIdx.map(bi2 => {
          const bp = B.profs[bi2];
          return A.profs.filter(ap => ap.nonNull > 0 && ap.type !== 'empty')
            .map(ap => ({ ap, ns: nameSim(ap.col, bp.col, B.name), tc: typeCompat(ap, bp), pm: patMatch(ap, bp) }))
            .filter(o => o.ns >= 0.8 && o.tc > 0).sort((x, y) => y.ns - x.ns).slice(0, 2);
        });
        if (options.some(o => !o.length)) return;
        const assign = [];
        (function rec(d) {
          if (d === options.length) {
            const idxs = assign.map(o => o.ap.idx);
            if (new Set(idxs).size !== idxs.length) return;
            const srcSet = tupleFreq(A.cols, idxs, A.n);
            const inc = inclusion(srcSet, tgtSet, st.fkMinIncl);
            if (inc < st.fkMinIncl) return;
            const avg = f => assign.reduce((s, o) => s + o[f], 0) / assign.length;
            const ns = avg('ns'), tc = avg('tc'), pm = avg('pm');
            const score = Math.round(Math.min(100, inc * 45 + ns * 20 + tc * 15 + pm * 10 + 10));
            if (score < st.keepScore) return;
            const o = orphanList(srcSet, tgtSet);
            const srcNN = A.n - srcSet.nullRows, srcU = srcSet.size === srcNN;
            const sc = assign.map(o2 => o2.ap.col);
            relsOut.push({
              key: A.id + '|' + sc.join(',') + '|' + B.id + '|' + kc.join(','),
              srcTable: A.id, srcCols: sc, tgtTable: B.id, tgtCols: kc.slice(),
              score, incl: inc, nameSim: ns, typeMatch: tc, patMatch: pm, tgtIsPK: B.effPK.join(',') === kc.join(','),
              card: tgtU ? (srcU ? '1:1' : '1:N') : 'N:M', srcOptional: srcSet.nullRows > 0,
              orphanDistinct: o.d, orphanRows: o.r, orphans: o.list, srcNonNull: srcNN, kind: 'composite'
            });
            return;
          }
          for (const o of options[d]) { assign.push(o); rec(d + 1); assign.pop(); }
        })(0);
      });
    });
    P(75 + 5 * (bi + 1) / N, '複合外鍵：' + B.name);
  });

  // 1:1 雙向去重
  const byKey = new Map(relsOut.map(r => [r.key, r]));
  const drop = new Set();
  relsOut.forEach(r => {
    if (r.card !== '1:1' || drop.has(r.key)) return;
    const rk = r.tgtTable + '|' + r.tgtCols.join(',') + '|' + r.srcTable + '|' + r.srcCols.join(',');
    const o = byKey.get(rk);
    if (o && !drop.has(rk)) {
      const ts = T.find(x => x.id === r.tgtTable), so = T.find(x => x.id === r.srcTable);
      if (o.score > r.score || (o.score === r.score && so.n > ts.n)) drop.add(r.key); else drop.add(rk);
    }
  });
  const relations = relsOut.filter(r => !drop.has(r.key));

  // 相依 + 代碼對照
  const fds = [], dicts = [];
  T.forEach((t, ti) => {
    fdTable(t, st, dicts).forEach(f => fds.push(f));
    P(80 + 17 * (ti + 1) / N, '欄位相依：' + t.name);
  });

  // 代碼表、列舉、日期
  const codeTables = [], enums = [], dates = [];
  T.forEach(t => {
    if (t.n > 0 && t.n <= 1000 && t.colNames.length <= 6 && t.effPK.length === 1) {
      const kp = t.profs.find(p => p.col === t.effPK[0]);
      const np = t.profs.find(p => p !== kp && p.hasCJK && (p.type === 'text' || p.type === 'code'));
      if (kp && codeLike(kp) && kp.maxLen <= 6 && np) codeTables.push({ tableId: t.id, codeCol: kp.col, nameCol: np.col, entries: t.n });
    }
    t.profs.forEach(p => {
      if (p.isEnum) enums.push({ tableId: t.id, col: p.col, distinct: p.distinct, values: p.top10 });
      if (p.type === 'dateAD' || p.type === 'dateROC') dates.push({ tableId: t.id, col: p.col, type: p.type, min: p.dMin, max: p.dMax, sample: p.rocSample, pattern: p.patternDesc });
    });
  });
  P(100, '整理結果…');
  const profiles = {};
  T.forEach(t => { profiles[t.id] = t.profs; });
  return {
    tables: T.map(t => ({ id: t.id, n: t.n, origN: t.origN, sampled: t.sampled, pkCands: t.pkCands.map(c => ({ cols: c.cols, score: c.score })) })),
    profiles, relations, fds, dicts, codeTables, enums, dates
  };
}

<script>
'use strict';
/* ===== 共用工具 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

      mk('rows', { keyPath: ['tableId', 'chunkNo'] }, ['tableId']);
      mk('profiles', { keyPath: 'id' }, ['tableId', 'wsId']);
      mk('relations', { keyPath: 'id' }, ['wsId']);
      mk('fds', { keyPath: 'id' }, ['wsId']);

  try { o.text = new TextDecoder(DECODER[enc] || 'utf-8').decode(o.buf); } catch (e) { o.text = new TextDecoder('utf-8').decode(o.buf); }
  if (!o.delim) o.delim = detectDelim(o.text.slice(0, 200000), o.file.name);
  o.preview = parseDelimited(o.text, o.delim, 101);
  o.lineCount = (o.text.match(/\n/g) || []).length + (o.text.endsWith('\n') ? 0 : 1);
}

function buildTable(parsed, header) {
  let rows = parsed.filter(r => !(r.length === 1 && r[0] === ''));
  let hdr = header ? (rows.shift() || []) : [];
  let w = hdr.length;
  for (const r of rows) if (r.length > w) w = r.length;
  const seen = new Map(), cols = [];
  for (let i = 0; i < w; i++) {
    let nm = String(hdr[i] == null ? '' : hdr[i]).trim() || 'COL_' + (i + 1);
    let base = nm, k = 2;
    while (seen.has(nm)) nm = base + '_' + (k++);
    seen.set(nm, 1);
    cols.push(nm);
  }
  for (const r of rows) while (r.length < w) r.push('');
  return { cols, rows };
}

/* ===== 分析 ===== */
function setProg(p, msg) { $('#pbarFill').style.width = p + '%'; $('#pmsg').textContent = msg; }
function endBusy() { S.busy = false; $('#btnCancel').hidden = true; $('#btnAnalyze').disabled = false; if (S.worker && S.worker.terminate) S.worker.terminate(); S.worker = null; }
function makeInlineWorker(handler) {
  let dead = false;
  const selfObj = { postMessage: m => setTimeout(() => { if (!dead) handler({ data: m }); }, 0), onmessage: null };
  new Function('self', $('#workerSrc').textContent)(selfObj);
  return { postMessage: m => { if (!dead) setTimeout(() => selfObj.onmessage({ data: m }), 30); }, terminate() { dead = true; } };
}
A.analyze = async () => {
  if (S.busy) return;
  if (!S.tables.length) return toast('請先匯入資料表');
  S.busy = true;
  $('#btnCancel').hidden = false;
  $('#btnAnalyze').disabled = true;
  setProg(0, '載入資料…');
  try {
    const tables = [];
    for (const t of S.tables) tables.push({ id: t.id, name: t.name, cols: t.cols, rows: await getRows(t.id) });
    const manualPK = {}, rejectedPK = {};
    S.tables.forEach(t => { if (t.pk && t.pk.cols && t.pk.cols.length) manualPK[t.id] = t.pk.cols; rejectedPK[t.id] = t.pkRejected || []; });
    const msg = { type: 'analyze', payload: { tables, settings: S.ws.settings, manualPK, rejectedPK } };
    let got = false;
    const handler = async e => {
      got = true;
      const m = e.data;
      if (m.type === 'progress') setProg(m.p, m.msg);
      else if (m.type === 'done') {
        setProg(100, '儲存結果…');
        try { await onAnalysisDone(m.result); setProg(100, `分析完成（${(m.result.ms / 1000).toFixed(1)} 秒）`); toast('分析完成'); }
        catch (err) { console.error(err); setProg(0, '儲存失敗：' + err.message); }
        endBusy();
      } else if (m.type === 'error') { console.error(m.message); setProg(0, '分析錯誤：' + m.message.split('\n')[0]); endBusy(); }
    };
    let w;
    try {
      const url = URL.createObjectURL(new Blob([$('#workerSrc').textContent], { type: 'text/javascript' }));
      w = new Worker(url);
      w.onmessage = handler;
      w.onerror = ev => {
        if (!got) { ev.preventDefault(); const iw = makeInlineWorker(handler); S.worker = iw; iw.postMessage(msg); }
        else { setProg(0, '分析錯誤：' + ev.message); endBusy(); }
      };
    } catch (e) { w = makeInlineWorker(handler); }
    S.worker = w;
    w.postMessage(msg);
  } catch (err) { console.error(err); toast(err.message); setProg(0, '錯誤：' + err.message); endBusy(); }
};
A.cancel = () => { if (!S.busy) return; endBusy(); setProg(0, '已取消分析'); toast('已取消'); };
async function onAnalysisDone(r) {
  const wsId = S.ws.id;
  await dbDelByIndex('profiles', 'wsId', wsId);
  const profRecs = [];
  for (const [tid, arr] of Object.entries(r.profiles)) arr.forEach(p => profRecs.push({ ...p, id: tid + '|' + p.idx, wsId, tableId: tid }));
  await dbPutMany('profiles', profRecs);
  for (const ti of r.tables) {
    const t = TB(ti.id);
    if (!t) continue;
    t.pkCands = ti.pkCands; t.sampled = ti.sampled; t.analyzedRows = ti.n;
  }
  await dbPutMany('tables', S.tables);
  const old = S.relations;
  const keep = new Map(old.filter(x => x.status !== 'pending' || x.origin === 'manual').map(x => [x.key, x]));
  const out = [];
  const METRICS = ['score', 'incl', 'nameSim', 'typeMatch', 'patMatch', 'tgtIsPK', 'card', 'srcOptional', 'orphanDistinct', 'orphanRows', 'orphans', 'srcNonNull', 'kind'];
  for (const nr of r.relations) {
    const o = keep.get(nr.key);
    if (o) { if (o.origin !== 'manual') METRICS.forEach(k => { o[k] = nr[k]; }); o.stale = false; out.push(o); keep.delete(nr.key); }
    else out.push({ ...nr, id: uid(), wsId, status: 'pending', origin: 'auto', note: '', cardOverride: '', stale: false });
  }
  for (const o of keep.values()) { if (o.origin === 'auto') o.stale = true; out.push(o); }
  await dbDelByIndex('relations', 'wsId', wsId);
  await dbPutMany('relations', out);
  await dbDelByIndex('fds', 'wsId', wsId);
  await dbPutMany('fds', r.fds.map(f => ({ ...f, id: uid(), wsId })));
  S.ws.analysis = { analyzedAt: Date.now(), ms: r.ms, dicts: r.dicts, enums: r.enums, dates: r.dates, codeTables: r.codeTables, sampled: r.tables.filter(t => t.sampled).map(t => t.id) };
  await saveWs();
  await loadWs(wsId);
}

/* ===== 手動關聯評估、主鍵驗證 ===== */
async function evalRel(srcT, srcCols, tgtT, tgtCols) {
  const nv = mkNorm(S.ws.settings);
  const sr = await getRows(srcT.id), tr = await getRows(tgtT.id);
  const si = srcCols.map(c => srcT.cols.indexOf(c)), ti = tgtCols.map(c => tgtT.cols.indexOf(c));
  const tf = (rows, idx) => {
    const m = new Map(); let nulls = 0;
    for (const r of rows) {
      let k = '', bad = false;
      for (let q = 0; q < idx.length; q++) { const v = nv(r[idx[q]]); if (v === null) { bad = true; break; } k += (q ? '\u0001' : '') + v; }
      if (bad) { nulls++; continue; }
      m.set(k, (m.get(k) || 0) + 1);
    }
    return { m, nulls };
  };
  const Aa = tf(sr, si), Bb = tf(tr, ti);
  let hit = 0, od = 0, orr = 0;
  const ol = [];
  for (const [k, c] of Aa.m) { if (Bb.m.has(k)) hit++; else { od++; orr += c; if (ol.length < 3000) ol.push([k.replace(/\u0001/g, ' | '), c]); } }
  ol.sort((a, b) => b[1] - a[1]);
  const incl = Aa.m.size ? hit / Aa.m.size : 0;
  const srcNN = sr.length - Aa.nulls, srcU = Aa.m.size === srcNN, tgtU = Bb.m.size === tr.length - Bb.nulls;
  return {
    incl, card: tgtU ? (srcU ? '1:1' : '1:N') : 'N:M', srcOptional: Aa.nulls > 0, orphanDistinct: od, orphanRows: orr, orphans: ol.slice(0, 300),
    srcNonNull: srcNN, score: Math.round(incl * 100), nameSim: null, typeMatch: null, patMatch: null, tgtIsPK: sameArr(effPK(tgtT), tgtCols), kind: srcCols.length > 1 ? 'composite' : 'single'
  };
}
async function verifyPK(t, cols) {
  const rows = await getRows(t.id), nv = mkNorm(S.ws.settings), idx = cols.map(c => t.cols.indexOf(c));
  const s = new Set(); let nulls = 0, dup = 0; const ex = [];
  for (const r of rows) {
    let k = '', bad = false;
    for (let q = 0; q < idx.length; q++) { const v = nv(r[idx[q]]); if (v === null) bad = true; k += (q ? '\u0001' : '') + (v == null ? '∅' : v); }
    if (bad) nulls++;
    if (s.has(k)) { dup++; if (ex.length < 5) ex.push(k.replace(/\u0001/g, ' | ')); } else s.add(k);
  }
  return { nulls, dup, ex, total: rows.length };
}

function renderRfPairs(sc, tc) {

A['rel-edit'] = el => relForm(S.relations.find(x => x.id === el.dataset.rid));
A['rf-save'] = async () => {
  const src = TB($('#rfSrc').value), tgt = TB($('#rfTgt').value);
  const sc = [], tc = [];
  for (let i = 0; i < 3; i++) { const a = $('#rfS' + i).value, b = $('#rfT' + i).value; if (a && b) { sc.push(a); tc.push(b); } else if (a || b) return toast(`第 ${i + 1} 組欄位對應不完整`); }
  if (!sc.length) return toast('請至少設定一組欄位對應');
  if (src.id === tgt.id && sameArr(sc, tc)) return toast('來源與目標不可相同');
  const card = $('#rfCard').value, status = $('#rfStatus').value, note = $('#rfNote').value.trim();
  const key = `${src.id}|${sc.join(',')}|${tgt.id}|${tc.join(',')}`;
  const rid = S.modalCtx.rid;
  const old = rid ? S.relations.find(x => x.id === rid) : null;
  const dup = S.relations.find(x => x.key === key && x.id !== rid);
  if (dup) return toast('已有相同的關聯');
  const changedCols = !old || old.key !== key;
  let rec = old || { id: uid(), wsId: S.ws.id, origin: 'manual', stale: false };
  if (changedCols) {
    const m = await evalRel(src, sc, tgt, tc);
    Object.assign(rec, m, { key, srcTable: src.id, srcCols: sc, tgtTable: tgt.id, tgtCols: tc });
    if (old) rec.origin = 'manual';
  }
  Object.assign(rec, { cardOverride: card, status, note });
  await dbPut('relations', rec);
  if (!old) S.relations.push(rec);
  S.modalCtx = null;
  closeModal();
  renderAll();
  if (S.tab === 'er') drawER();
  showRelDetail(rec.id);
  toast(`已儲存（包含率 ${pct(rec.incl)}）`);
};

  <td class="num" style="color:${x.exact ? 'var(--theme-success)' : 'var(--theme-warning)'}">${x.exact ? '0%' : pct(x.violRate, 2)}</td><td>${x.exact ? '<span class="tag ok">完全</span>' : '<span class="tag warn">近似</span>'}${x.bijection ? '<span class="tag acc">一對一對應</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">沒有偵測到相依關係</td></tr>'}

  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { return toast('JSON 格式錯誤'); }
  if (!d || d.format !== 'DataRelationshipExplorer') return toast('不是資料關聯探索器的工作區檔案');
  const wsId = uid(), tmap = new Map(d.tables.map(t => [t.id, uid()]));
  const mt = id => tmap.get(id) || id;
  const names = new Set(S.wsList.map(w => w.name));
  let name = d.ws.name; while (names.has(name)) name += '（匯入）';
  const ws = { ...d.ws, id: wsId, name, settings: { ...DEFAULT_SETTINGS, ...(d.ws.settings || {}) } };
  if (ws.analysis) ['dicts', 'enums', 'dates', 'codeTables'].forEach(k => { (ws.analysis[k] || []).forEach(x => { x.tableId = mt(x.tableId); }); }), ws.analysis.sampled = (ws.analysis.sampled || []).map(mt);
  await dbPut('workspaces', ws);
  for (const t of d.tables) await saveTable({ ...t, id: mt(t.id), wsId }, d.rows[t.id] || []);
  await dbPutMany('profiles', (d.profiles || []).map(p => ({ ...p, tableId: mt(p.tableId), id: mt(p.tableId) + '|' + p.idx, wsId })));
  await dbPutMany('relations', (d.relations || []).map(r => { const s = mt(r.srcTable), t = mt(r.tgtTable); return { ...r, id: uid(), wsId, srcTable: s, tgtTable: t, key: `${s}|${r.srcCols.join(',')}|${t}|${r.tgtCols.join(',')}` }; }));
  await dbPutMany('fds', (d.fds || []).map(f => ({ ...f, id: uid(), wsId, tableId: mt(f.tableId) })));
  const lay = d.layout || { pos: {}, zoom: 1, pan: { x: 40, y: 40 }, hidden: [] }, pos = {};
  Object.entries(lay.pos || {}).forEach(([k, v]) => { pos[mt(k)] = v; });
  await dbPut('layouts', { ...lay, wsId, pos, hidden: (lay.hidden || []).map(mt) });
  S.wsList.push(ws);
  await loadWs(wsId);
  toast(`已匯入工作區「${name}」`);
}

/* ===== 範例資料 ===== */
A['load-sample'] = async () => {
  const exist = S.tables.length;
  if (exist && !confirm('範例資料會建立在新的工作區「範例：放款系統」，確定？')) return;
  let ws = S.ws;
  if (exist) { ws = newWs('範例：放款系統'); await dbPut('workspaces', ws); S.wsList.push(ws); }
  for (const t of genSampleData()) {
    await saveTable({ id: uid(), wsId: ws.id, name: t.name, cols: t.cols, rowCount: t.rows.length, encoding: 'utf-8', delimiter: ',', fileName: t.name + '.csv（範例）', importedAt: Date.now(), pk: null, pkCands: [], pkRejected: [] }, t.rows);
  }
  await loadWs(ws.id);
  toast('已載入範例資料，開始分析…');
  await A.analyze();
};
/* ===== 範例資料產生器 ===== */
function genSampleData() {
  let seed = 20261015;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pick = a => a[Math.floor(rnd() * a.length)];
  const p = (n, w) => String(n).padStart(w, '0');
  const brNames = ['總行營業部', '台北分行', '中山分行', '信義分行', '板橋分行', '桃園分行', '新竹分行', '台中分行', '台南分行', '高雄分行', '花蓮分行', '金門分行'];
  const BRANCH = { name: 'BRANCH', cols: ['分行別', '分行名稱', '區域'], rows: [] };
  brNames.forEach((n, i) => BRANCH.rows.push([p(i + 1, 3), n, i < 5 ? '北區' : i < 8 ? '中區' : '南區']));
  const types = [['01', '個人'], ['02', '中小企業'], ['03', '大型企業'], ['04', '政府機關']];
  const CUST = { name: 'CUST', cols: ['統一編號', '客戶名稱', '客戶類別代碼', '客戶類別名稱', '主往來分行', '建檔日'], rows: [] };
  const ids = new Set();
  while (ids.size < 220) ids.add(String(ri(10000000, 99999999)));
  const idArr = [...ids];
  idArr.forEach((id, i) => {
    const t = pick(types);
    CUST.rows.push([id, '客戶' + p(i + 1, 4) + (t[0] === '01' ? '' : '股份有限公司'), t[0], t[1], p(ri(1, 12), 3),
      `${ri(2015, 2025)}-${p(ri(1, 12), 2)}-${p(ri(1, 28), 2)}`]);
  });
  const LNMR = { name: 'LNMR', cols: ['分行別', '帳號', '分號', '統一編號', '貸放日', '到期日', '放款餘額', '還本方式'], rows: [] };
  const keys = new Set();
  const loans = [];
  for (let a = 0; a < 320; a++) {
    const acct = '5031' + p(ri(0, 99999999), 8);
    const brs = rnd() < 0.3 ? [p(ri(1, 12), 3), p(ri(1, 12), 3)] : [p(ri(1, 12), 3)];
    brs.forEach(br => {
      const subs = ri(1, 3);
      for (let s = 1; s <= subs; s++) {
        const k = br + acct + s;
        if (keys.has(k)) continue;
        keys.add(k);
        loans.push([br, acct, p(s, 3)]);
      }
    });
  }
  loans.forEach((l, i) => {
    const cid = i < 3 ? String(ri(10000000, 99999999)) : pick(idArr);
    const y = ri(105, 113);
    LNMR.rows.push([l[0], l[1], l[2], cid, `${y}${p(ri(1, 12), 2)}${p(ri(1, 28), 2)}`, `${y + ri(1, 7)}${p(ri(1, 12), 2)}${p(ri(1, 28), 2)}`,
      String(ri(10, 5000) * 1000), pick(['1', '1', '1', '3', '9'])]);
  });
  const LLCON = { name: 'LLCON', cols: ['契約編號', '分行別', '帳號', '分號', '核准額度', '契約止日', '利率'], rows: [] };
  loans.forEach((l, i) => {
    if (rnd() < 0.7) LLCON.rows.push(['C' + p(i + 1, 7), l[0], l[1], l[2], String(ri(50, 8000) * 1000), `${ri(114, 120)}/${p(ri(1, 12), 2)}/${p(ri(1, 28), 2)}`, (ri(150, 380) / 100).toFixed(2)]);
  });
  return [BRANCH, CUST, LNMR, LLCON];
}
init();
