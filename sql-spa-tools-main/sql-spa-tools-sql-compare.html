<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">

<title>SQL SPA Tools｜Oracle SQL Compare</title>
<style>
*{box-sizing:border-box}
input[type=checkbox],input[type=radio]{accent-color:#616161}
html,body{margin:0;height:100%}
body{font-family:var(--theme-font-sans);font-size:14px;color:#464646;background:#f4f4f4;display:flex;flex-direction:column}
header{background:#616161;color:#fefefe;padding:8px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;margin:0;font-weight:600}
header .ver{font-size:12px;opacity:.7}
header .sp{flex:1}
header .hint{font-size:12px;opacity:.8}
.toolbar{background:#fefefe;border-bottom:1px solid #d1d1d1;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.toolbar .grp{display:flex;gap:10px;align-items:center;padding-right:14px;border-right:1px solid #e4e4e4}
.toolbar .grp:last-child{border-right:none}
.toolbar label{cursor:pointer;user-select:none;white-space:nowrap}
.toolbar .ttl{font-size:12px;color:#6b6b6b}
button{font:inherit;border:1px solid #d1d1d1;background:#efefef;border-radius:6px;padding:4px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:#eaeaea}
button.primary{background:#616161;border-color:#616161;color:#fefefe;font-weight:600}
button.primary:hover{background:#505050}
button:disabled{opacity:.45;cursor:default}
select{font:inherit;padding:3px 4px;border-radius:6px;border:1px solid #d1d1d1}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#editView{flex:1;min-height:0;display:flex;gap:10px;padding:10px 16px}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:#fefefe;border:1px solid #d1d1d1;border-radius:8px;overflow:hidden}
.pane.drag{outline:3px dashed #616161;outline-offset:-3px}
.pane-hd{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#efefef;border-bottom:1px solid #d1d1d1}
.pane-hd b{font-size:13px}
.pane-hd .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b6b6b;font-size:12px}
.pane-hd .cnt{font-size:12px;color:#6b6b6b}
.pane textarea{flex:1;border:none;resize:none;padding:8px 10px;font-family:var(--theme-font-mono);font-size:13px;line-height:1.5;outline:none;white-space:pre;overflow:auto;tab-size:4}
#resultView{flex:1;min-height:0;display:none;flex-direction:column}
#resultInfo{padding:6px 16px;background:#fefefe;border-bottom:1px solid #d1d1d1;display:flex;gap:16px;align-items:center;font-size:13px;flex-wrap:wrap}
#resultInfo .files{color:#6b6b6b;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#resultScroll{flex:1;min-height:0;overflow:auto;background:#fefefe}
.tabs{display:flex;gap:4px}
.tab{border-radius:6px;padding:3px 12px;font-size:13px}
.tab.on{background:#616161;border-color:#616161;color:#fefefe}
.tab .bdg{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#616161;color:#fefefe;font-size:11px;line-height:16px;text-align:center}
.tab .bdg.zero{background:#6e6e6e}
#summaryBody{display:none}

footer{background:#fefefe;border-top:1px solid #d1d1d1;padding:6px 16px;display:flex;gap:16px;align-items:center;font-size:13px}

<header>
  <h1>SQL SPA Tools｜Oracle SQL Compare</h1><span class="ver">SQL 差異比對</span>
  <span class="sp"></span>

  <div class="grp">
    <span class="ttl">比對選項</span>

  </div>
  <div class="grp">
    <span class="ttl">顯示</span>
    <label><input type="radio" name="view" value="side" checked> 並排</label>
    <label><input type="radio" name="view" value="inline"> 整合</label>
    <label><input type="checkbox" id="optOnlyDiff"> 僅顯示差異</label>
    <label><input type="checkbox" id="optWrap" checked> 自動換行</label>
  </div>
  <div class="grp">
    <span class="ttl">編碼</span>
    <select id="optEnc"><option value="auto">自動 (UTF-8 → Big5)</option><option value="utf-8">UTF-8</option><option value="big5">Big5 / MS950</option></select>
  </div>
  <div class="grp">
    <button class="primary" id="btnCompare">▶ 比對</button>
    <button id="btnEdit" disabled>✎ 返回編輯</button>

    <button id="btnClear">清除</button>
    <button id="btnSample">範例</button>

</div>

<main>
  <div id="editView">
    <div class="pane" id="paneA">
      <div class="pane-hd"><b>舊版</b><span class="fname" id="nameA">（貼上 SQL 或拖放檔案）</span><span class="cnt" id="cntA"></span>
        <button data-open="A">開啟檔案</button><input type="file" id="fileA" accept=".sql,.txt,.pks,.pkb,.prc,.fnc,.trg,.vw,.pls,.pck,*" hidden></div>
      <textarea id="txtA" spellcheck="false" placeholder="貼上舊版 SQL，或將檔案拖放到此處"></textarea>
    </div>
    <div class="pane" id="paneB">
      <div class="pane-hd"><b>新版</b><span class="fname" id="nameB">（貼上 SQL 或拖放檔案）</span><span class="cnt" id="cntB"></span>
        <button data-open="B">開啟檔案</button><input type="file" id="fileB" accept=".sql,.txt,.pks,.pkb,.prc,.fnc,.trg,.vw,.pls,.pck,*" hidden></div>
      <textarea id="txtB" spellcheck="false" placeholder="貼上新版 SQL，或將檔案拖放到此處"></textarea>

</main>

</footer>

<!-- ====================== 比對引擎（純函式） ====================== -->
<script id="engine">
"use strict";
const TOKRE = /'(?:[^']|'')*'?|"[^"]*"?|\s+|[A-Za-z0-9_$#\u0080-\uFFFF]+|[^\s]/g;
const isWS = t => /^\s+$/.test(t);
const SQLKW = new Set(('SELECT FROM WHERE AND OR NOT IN IS NULL LIKE BETWEEN EXISTS AS ON JOIN INNER LEFT RIGHT FULL OUTER CROSS NATURAL USING GROUP BY ' +
  'HAVING ORDER ASC DESC NULLS FIRST LAST UNION ALL INTERSECT MINUS EXCEPT DISTINCT UNIQUE CASE WHEN THEN ELSE END INSERT INTO VALUES UPDATE SET ' +
  'DELETE MERGE MATCHED WITH CREATE REPLACE TABLE VIEW INDEX ALTER DROP TRUNCATE GRANT REVOKE BEGIN DECLARE IF LOOP FOR WHILE EXIT RETURN ' +
  'COMMIT ROLLBACK START CONNECT PRIOR OVER PARTITION FETCH OFFSET ROWS ONLY NOCYCLE SIBLINGS LATERAL APPLY PIVOT UNPIVOT ANY SOME ' +
  'ESCAPE RETURNING LOG ERRORS SAMPLE MODEL').split(' '));

/* ====================== 差異演算法 ====================== */
/* Myers O(ND) diff。a、b 為可用 === 比較的陣列。回傳 [[op, ai, bi], ...]，op 為 '=' '-' '+' */
function myers(a, b) {
  const n = a.length, m = b.length;
  let s = 0; while (s < n && s < m && a[s] === b[s]) s++;
  let e = 0; while (e < n - s && e < m - s && a[n - 1 - e] === b[m - 1 - e]) e++;
  const N = n - s - e, M = m - s - e;
  const ops = [];
  for (let i = 0; i < s; i++) ops.push(['=', i, i]);
  const mid = [];
  if (N === 0) { for (let j = 0; j < M; j++) mid.push(['+', -1, s + j]); }
  else if (M === 0) { for (let i = 0; i < N; i++) mid.push(['-', s + i, -1]); }
  else {
    const A = (i) => a[s + i], B = (j) => b[s + j];
    const max = N + M, off = max + 1, LIMIT = 8000;
    const v = new Int32Array(2 * max + 3);
    const trace = [];
    let found = -1;
    for (let d = 0; d <= max && d <= LIMIT; d++) {
      for (let k = -d; k <= d; k += 2) {
        let x = (k === -d || (k !== d && v[off + k - 1] < v[off + k + 1])) ? v[off + k + 1] : v[off + k - 1] + 1;
        let y = x - k;
        while (x < N && y < M && A(x) === B(y)) { x++; y++; }
        v[off + k] = x;
        if (x >= N && y >= M) { found = d; break; }
      }
      trace.push(v.slice(off - d, off + d + 1));
      if (found >= 0) break;
    }
    if (found < 0) {
      for (let i = 0; i < N; i++) mid.push(['-', s + i, -1]);
      for (let j = 0; j < M; j++) mid.push(['+', -1, s + j]);
    } else {
      let x = N, y = M;
      for (let d = found; d > 0; d--) {
        const vp = trace[d - 1], g = (k) => vp[k + d - 1];
        const k = x - y;
        const prevK = (k === -d || (k !== d && g(k - 1) < g(k + 1))) ? k + 1 : k - 1;
        const px = g(prevK), py = px - prevK;
        while (x > px && y > py) { x--; y--; mid.push(['=', s + x, s + y]); }
        if (x === px) { y--; mid.push(['+', -1, s + y]); } else { x--; mid.push(['-', s + x, -1]); }
        x = px; y = py;
      }
      while (x > 0 && y > 0) { x--; y--; mid.push(['=', s + x, s + y]); }
      mid.reverse();
    }
  }
  for (const o of mid) ops.push(o);
  for (let i = 0; i < e; i++) ops.push(['=', n - e + i, m - e + i]);
  return ops;
}
/* 找出兩區段中「各只出現一次」的行，取最長遞增子序列作為錨點（Patience Diff） */
function uniqueAnchors(a, b, a0, a1, b0, b1) {
  const ca = new Map(), cb = new Map();
  for (let i = a0; i < a1; i++) { const e = ca.get(a[i]); if (e) e.c++; else ca.set(a[i], { c: 1 }); }
  for (let j = b0; j < b1; j++) { const e = cb.get(b[j]); if (e) e.c++; else cb.set(b[j], { c: 1, j }); }
  const cand = [];
  for (let i = a0; i < a1; i++) { if (ca.get(a[i]).c !== 1) continue; const eb = cb.get(a[i]); if (eb && eb.c === 1) cand.push([i, eb.j]); }
  const tails = [], prev = new Array(cand.length);
  for (let x = 0; x < cand.length; x++) {
    const j = cand[x][1]; let lo = 0, hi = tails.length;
    while (lo < hi) { const md = (lo + hi) >> 1; if (cand[tails[md]][1] < j) lo = md + 1; else hi = md; }
    prev[x] = lo > 0 ? tails[lo - 1] : -1; tails[lo] = x;
  }
  const res = []; let x = tails.length ? tails[tails.length - 1] : -1;
  while (x >= 0) { res.push(cand[x]); x = prev[x]; }
  return res.reverse();
}
/* 行層級差異：Patience 錨點切段 + Myers 補細節，避免 ( ) , END; 等常見行造成錯位 */
function diffSeq(a, b) {
  const ops = [];
  const rec = (a0, a1, b0, b1) => {
    while (a0 < a1 && b0 < b1 && a[a0] === b[b0]) { ops.push(['=', a0, b0]); a0++; b0++; }
    const tail = [];
    while (a1 > a0 && b1 > b0 && a[a1 - 1] === b[b1 - 1]) { a1--; b1--; tail.push(['=', a1, b1]); }
    if (a0 === a1 || b0 === b1) {
      for (let i = a0; i < a1; i++) ops.push(['-', i, -1]);
      for (let j = b0; j < b1; j++) ops.push(['+', -1, j]);
    } else {
      const anc = uniqueAnchors(a, b, a0, a1, b0, b1);
      if (!anc.length) {
        for (const [op, i, j] of myers(a.slice(a0, a1), b.slice(b0, b1))) ops.push([op, i < 0 ? -1 : i + a0, j < 0 ? -1 : j + b0]);
      } else {
        let pa = a0, pb = b0;
        for (const [i, j] of anc) { rec(pa, i, pb, j); ops.push(['=', i, j]); pa = i + 1; pb = j + 1; }
        rec(pa, a1, pb, b1);
      }
    }
    for (let k = tail.length - 1; k >= 0; k--) ops.push(tail[k]);
  };
  rec(0, a.length, 0, b.length);
  return ops;
}
/* 依選項遮罩 SQL：註解 → 空白（保留換行），字串外轉小寫。字串與 "識別字" 原樣保留 */
function maskSql(text, o) {
  const out = []; const n = text.length; let i = 0, cs = 0;
  const flushCode = (to) => { if (to > cs) { const seg = text.slice(cs, to); out.push(o.ignoreCase ? seg.toLowerCase() : seg); } };
  const keepCmt = (seg) => o.ignoreComments ? seg.replace(/[^\n]/g, ' ') : (o.ignoreCase ? seg.toLowerCase() : seg);
  while (i < n) {
    const c = text[i], d = text[i + 1];
    let j = -1, kind = '';
    if (c === '-' && d === '-') { j = text.indexOf('\n', i); if (j < 0) j = n; kind = 'c'; }
    else if (c === '/' && d === '*') { j = text.indexOf('*/', i + 2); j = j < 0 ? n : j + 2; kind = 'c'; }
    else if ((c === 'q' || c === 'Q') && d === "'" && !/[\w$#]/.test(text[i - 1] || '')) {
      const op = text[i + 2] || ''; const cl = ({ '[': ']', '(': ')', '{': '}', '<': '>' })[op] || op;
      j = text.indexOf(cl + "'", i + 3); j = j < 0 ? n : j + 2; kind = 's';
    }
    else if (c === "'") { j = i + 1; while (j < n) { if (text[j] === "'") { if (text[j + 1] === "'") j += 2; else { j++; break; } } else j++; } kind = 's'; }
    else if (c === '"') { j = text.indexOf('"', i + 1); j = j < 0 ? n : j + 1; kind = 's'; }
    if (kind) {
      flushCode(i);
      const seg = text.slice(i, j);
      out.push(kind === 'c' ? keepCmt(seg) : seg);
      i = cs = j;
    } else i++;
  }
  flushCode(n);
  return out.join('');
}
function lineKey(line, o) {
  if (o.ignoreWS) {
    let t = (line.match(TOKRE) || []).filter(x => !isWS(x));
    if (o.ignoreTerm) { if (t.length === 1 && t[0] === '/') t = []; else if (t[t.length - 1] === ';') t.pop(); }
    return t.join('\u0001');
  }
  let k = o.ignoreComments ? line.replace(/\s+$/, '') : line;
  if (o.ignoreTerm) { if (k.trim() === '/') k = ''; else k = k.replace(/;(\s*)$/, '$1'); }
  return k;
}
function prepare(text, o) {
  const raw = text.replace(/\r\n?/g, '\n');
  const lines = raw.split('\n');
  const masked = maskSql(raw, o).split('\n');
  if (lines.length > 1 && lines[lines.length - 1] === '') { lines.pop(); masked.pop(); }
  if (lines.length === 1 && lines[0] === '') { lines.pop(); masked.pop(); }
  const keys = [], skip = [];
  for (let i = 0; i < lines.length; i++) {
    const k = lineKey(masked[i] ?? '', o);
    keys.push(k);
    skip.push(k.trim() === '' && (lines[i].trim() !== '' || o.ignoreBlank));
  }
  return { lines, keys, skip };
}
const escHtml = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
/* 行內 Token 差異，回傳兩側 HTML（含語意清理：夾在變更中的 . , 空白 等小片段併入變更，減少破碎標示） */
function inlineDiff(a, b, o) {
  const ta = a.match(TOKRE) || [], tb = b.match(TOKRE) || [];
  const key = t => isWS(t) ? (o.ignoreWS ? ' ' : t) : (o.ignoreCase && !/^['"]/.test(t) ? t.toLowerCase() : t);
  let ops = myers(ta.map(key), tb.map(key));
  const tiny = t => isWS(t) || (t.length === 1 && !/[\w$#\u0080-\uFFFF]/.test(t));
  const segs = [];
  for (const op of ops) { const eq = op[0] === '='; if (!segs.length || segs[segs.length - 1].eq !== eq) segs.push({ eq, ops: [] }); segs[segs.length - 1].ops.push(op); }
  for (let s = 1; s < segs.length - 1; s++) {
    const sg = segs[s];
    if (sg.eq && sg.ops.length <= 2 && sg.ops.every(([, i]) => tiny(ta[i]))) {
      sg.ops = sg.ops.flatMap(([, i, j]) => [['-', i, -1], ['+', -1, j]]);
    }
  }
  ops = segs.flatMap(s => s.ops);
  let ha = '', hb = '', bufA = '', bufB = '', markA = false, markB = false;
  const pA = (t, mk) => { if (mk !== markA) { ha += markA ? '<span class="hl">' + bufA + '</span>' : bufA; bufA = ''; markA = mk; } bufA += escHtml(t); };
  const pB = (t, mk) => { if (mk !== markB) { hb += markB ? '<span class="hl">' + bufB + '</span>' : bufB; bufB = ''; markB = mk; } bufB += escHtml(t); };
  for (const [op, i, j] of ops) {
    if (op === '=') { pA(ta[i], false); pB(tb[j], false); }
    else if (op === '-') pA(ta[i], !(o.ignoreWS && isWS(ta[i])));
    else pB(tb[j], !(o.ignoreWS && isWS(tb[j])));
  }
  pA('', !markA); pB('', !markB);
  return [ha, hb];
}
/* ---------- 修改行配對 ---------- */
function tokW(t) {
  if (/^[A-Za-z_]/.test(t) && SQLKW.has(t.toUpperCase())) return 0.6;
  if (t.length === 1 && !/[\w$#\u0080-\uFFFF]/.test(t)) return 0.25;
  return 1;
}
function bigramDice(x, y) {
  if (x === y) return 1; if (x.length < 2 || y.length < 2) return 0;
  const m = new Map();
  for (let i = 0; i < x.length - 1; i++) { const g = x.substr(i, 2); m.set(g, (m.get(g) || 0) + 1); }
  let hit = 0;
  for (let i = 0; i < y.length - 1; i++) { const g = y.substr(i, 2); const c = m.get(g); if (c) { hit++; m.set(g, c - 1); } }
  return 2 * hit / (x.length + y.length - 2);
}
const lineToks = (s, o) => (s.match(TOKRE) || []).filter(t => !isWS(t)).map(t => o.ignoreCase && !/^['"]/.test(t) ? t.toLowerCase() : t);
/* 相似度 = 加權 Token LCS（關鍵字、標點權重較低）× 0.65 + 字元雙字母組 × 0.35（可抓到 BALANCE → CUR_BALANCE 這類改名） */
function lineSim(a, b, o) {
  const ta = lineToks(a, o), tb = lineToks(b, o);
  if (!ta.length && !tb.length) return 1;
  if (!ta.length || !tb.length) return 0;
  let wa = 0, wb = 0, wm = 0;
  for (const t of ta) wa += tokW(t);
  for (const t of tb) wb += tokW(t);
  for (const [op, i] of myers(ta, tb)) if (op === '=') wm += tokW(ta[i]);
  return 0.65 * (2 * wm / (wa + wb)) + 0.35 * bigramDice(ta.join(' '), tb.join(' '));
}
/* 依相似度配對修改行：保持順序、DP 取最大總分；短行需更高門檻；位置接近者加分；大區塊分段處理 */
function pairLines(da, ib, o) {
  const n = da.length, m = ib.length;
  if (!n || !m) return [];
  if (n * m > 40000) {
    const parts = Math.ceil(Math.max(n, m) / 150), res = [];
    for (let p = 0; p < parts; p++) {

document.head.insertAdjacentHTML('beforeend', '<style>' + DIFF_CSS + '</style>');

const $ = id => document.getElementById(id);
const state = { res: null, names: { A: '', B: '' }, expanded: new Set(), cur: -1, view: 'side', tab: 'diff', foldOf: new Map() };
const CONTEXT = 3;

function opts() {
  return {
    ignoreCase: $('optCase').checked, ignoreWS: $('optWS').checked, ignoreComments: $('optComment').checked,
    ignoreBlank: $('optBlank').checked, ignoreTerm: $('optTerm').checked
  };
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }
function updateCount(side) { const v = $('txt' + side).value; $('cnt' + side).textContent = v ? (v.replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n').length + ' 行') : ''; }

/* ---------- 讀檔與編碼偵測 ---------- */
async function loadFile(side, file) {
  const buf = await file.arrayBuffer();
  const enc = $('optEnc').value; let text, used = enc;
  if (enc === 'auto') {
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); used = 'UTF-8'; }
    catch { text = new TextDecoder('big5').decode(buf); used = 'Big5'; }
  } else { text = new TextDecoder(enc).decode(buf); used = enc === 'big5' ? 'Big5' : 'UTF-8'; }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  $('txt' + side).value = text;
  state.names[side] = file.name;
  $('name' + side).textContent = `${file.name}（${used}）`;
  $('name' + side).title = file.name;
  updateCount(side);
}
for (const side of ['A', 'B']) {
  const pane = $('pane' + side), fi = $('file' + side);
  pane.querySelector('[data-open]').onclick = () => fi.click();
  fi.onchange = () => { if (fi.files[0]) loadFile(side, fi.files[0]); fi.value = ''; };
  pane.addEventListener('dragover', e => { e.preventDefault(); pane.classList.add('drag'); });
  pane.addEventListener('dragleave', () => pane.classList.remove('drag'));
  pane.addEventListener('drop', e => { e.preventDefault(); pane.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) loadFile(side, f); });
  const ta = $('txt' + side);
  ta.addEventListener('input', () => { updateCount(side); if (!ta.value) { state.names[side] = ''; $('name' + side).textContent = '（貼上 SQL 或拖放檔案）'; } });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); updateCount(side); }
  });
}

/* ---------- 比對與畫面 ---------- */
function runCompare() {
  const a = $('txtA').value, b = $('txtB').value;
  if (!a && !b) { toast('請先輸入或開啟要比對的 SQL'); return; }
  const t0 = performance.now();
  state.res = compareSql(a, b, opts());
  state.ms = Math.round(performance.now() - t0);
  state.expanded.clear(); state.cur = -1;
  showResult();
}

function showResult() {
  $('editView').style.display = 'none';
  $('resultView').style.display = 'flex';
  $('btnEdit').disabled = false;
  render();
  if (state.res.blocks.length) { if (state.tab === 'diff') goto(0); else { state.cur = 0; markCurrent(); } }
}
function showEdit() {
  $('editView').style.display = 'flex';
  $('resultView').style.display = 'none';
  $('btnEdit').disabled = true;
}

function visibility(rows, blocks) {
  const vis = new Array(rows.length).fill(!$('optOnlyDiff').checked);
  if ($('optOnlyDiff').checked) for (const [s, e] of blocks) for (let i = Math.max(0, s - CONTEXT); i <= Math.min(rows.length - 1, e + CONTEXT); i++) vis[i] = true;
  return vis;
}

function render() {
  const res = state.res; if (!res) return;
  const o = opts(); const { rows, stats, blocks, A, B } = res;
  const side = state.view === 'side';
  const nA = state.names.A || '舊版（貼上內容）', nB = state.names.B || '新版（貼上內容）';
  $('resFiles').textContent = `舊：${nA}　⇄　新：${nB}`;
  $('resOpts').textContent = optText(o);

  const vis = visibility(rows, blocks);
  const h = [`<table class="diff${$('optWrap').checked ? ' wrap' : ''}" id="diffTable">`];
  h.push(side ? '<colgroup><col style="width:52px"><col style="width:20px"><col><col style="width:52px"><col style="width:20px"><col></colgroup>'
              : '<colgroup><col style="width:52px"><col style="width:52px"><col style="width:20px"><col></colgroup>');
  const E = escHtml;
  const mvC = r => r.mv !== undefined ? ' mv' : '';
  const mvT = r => r.mv === undefined ? '' : ` title="${r.t === 'del' ? `已搬移至新版第 ${r.mv + 1} 行` : `由舊版第 ${r.mv + 1} 行搬移而來`}"`;
  state.foldOf = new Map();
  for (let i = 0; i < rows.length; i++) {
    if (!vis[i]) {
      let j = i; while (j < rows.length && !vis[j]) j++;
      if (state.expanded.has(i)) { for (let x = i; x < j; x++) vis[x] = true; }
      else { for (let x = i; x < j; x++) state.foldOf.set(x, i); h.push(`<tr class="fold" data-fold="${i}"><td colspan="${side ? 6 : 4}">⋯ 展開 ${j - i} 行相同內容 ⋯</td></tr>`); i = j - 1; continue; }
    }
    const r = rows[i], id = `id="r${i}"`;
    const L = r.l !== undefined ? r.l + 1 : '', R = r.r !== undefined ? r.r + 1 : '';
    if (side) {
      if (r.t === 'eq') h.push(`<tr ${id} class="eq${r.soft ? ' soft' : ''}"><td class="ln">${L}</td><td class="mk">${r.soft ? '≈' : ''}</td><td class="code">${E(A.lines[r.l])}</td><td class="ln sep">${R}</td><td class="mk">${r.soft ? '≈' : ''}</td><td class="code">${E(B.lines[r.r])}</td></tr>`);
      else if (r.t === 'mod') h.push(`<tr ${id} class="mod"><td class="ln cl">${L}</td><td class="mk cl">~</td><td class="code cl">${r.hl}</td><td class="ln sep cr">${R}</td><td class="mk cr">~</td><td class="code cr">${r.hr}</td></tr>`);
      else if (r.t === 'del') h.push(`<tr ${id} class="del${mvC(r)}"${mvT(r)}><td class="ln cl">${L}</td><td class="mk cl">${r.mv !== undefined ? '⇅' : '−'}</td><td class="code cl">${E(A.lines[r.l])}</td><td class="ln sep"></td><td class="mk"></td><td class="code cr"></td></tr>`);
      else if (r.t === 'add') h.push(`<tr ${id} class="add${mvC(r)}"${mvT(r)}><td class="ln"></td><td class="mk"></td><td class="code cl"></td><td class="ln sep cr">${R}</td><td class="mk cr">${r.mv !== undefined ? '⇅' : '+'}</td><td class="code cr">${E(B.lines[r.r])}</td></tr>`);
      else if (r.l !== undefined) h.push(`<tr ${id} class="skip" title="依比對選項忽略"><td class="ln">${L}</td><td class="mk">·</td><td class="code on">${E(A.lines[r.l])}</td><td class="ln sep"></td><td class="mk"></td><td class="code"></td></tr>`);
      else h.push(`<tr ${id} class="skip" title="依比對選項忽略"><td class="ln"></td><td class="mk"></td><td class="code"></td><td class="ln sep">${R}</td><td class="mk">·</td><td class="code on">${E(B.lines[r.r])}</td></tr>`);
    } else {
      if (r.t === 'eq') h.push(`<tr ${id} class="eq${r.soft ? ' soft' : ''}"><td class="ln">${L}</td><td class="ln">${R}</td><td class="mk">${r.soft ? '≈' : ''}</td><td class="code">${E(B.lines[r.r])}</td></tr>`);
      else if (r.t === 'mod') h.push(`<tr ${id} class="mod"><td class="ln cl">${L}</td><td class="ln cl"></td><td class="mk cl">−</td><td class="code cl">${r.hl}</td></tr><tr class="mod"><td class="ln cr"></td><td class="ln cr">${R}</td><td class="mk cr">+</td><td class="code cr">${r.hr}</td></tr>`);
      else if (r.t === 'del') h.push(`<tr ${id} class="del${mvC(r)}"${mvT(r)}><td class="ln cl">${L}</td><td class="ln cl"></td><td class="mk cl">${r.mv !== undefined ? '⇅' : '−'}</td><td class="code cl">${E(A.lines[r.l])}</td></tr>`);
      else if (r.t === 'add') h.push(`<tr ${id} class="add${mvC(r)}"${mvT(r)}><td class="ln cr"></td><td class="ln cr">${R}</td><td class="mk cr">${r.mv !== undefined ? '⇅' : '+'}</td><td class="code cr">${E(B.lines[r.r])}</td></tr>`);
      else h.push(`<tr ${id} class="skip" title="依比對選項忽略"><td class="ln">${L}</td><td class="ln">${R}</td><td class="mk">·</td><td class="code on">${E(r.l !== undefined ? A.lines[r.l] : B.lines[r.r])}</td></tr>`);
    }
  }
  h.push('</table>');
  $('resultBody').innerHTML = blocks.length || rows.length ? h.join('') : '';

  $('stats').innerHTML = `<span class="stat-add">+${stats.add} 新增</span>　<span class="stat-del">−${stats.del} 刪除</span>　<span class="stat-mod">~${stats.mod} 修改</span>　<span class="stat-mv">⇅${stats.move} 搬移</span>　<span class="stat-skip">·${stats.skip} 忽略</span>　｜　舊 ${stats.linesA} 行 / 新 ${stats.linesB} 行　｜　${state.ms} ms`;
  for (const b of ['btnCopy', 'btnExport', 'btnCopySum']) $(b).disabled = false;
  renderSummary();
  applyTab();
  $('btnPrev').disabled = $('btnNext').disabled = !blocks.length;
  markCurrent();
}

function optText(o) {
  const a = [];
  if (o.ignoreCase) a.push('忽略大小寫'); if (o.ignoreWS) a.push('忽略空白'); if (o.ignoreComments) a.push('忽略註解');
  if (o.ignoreBlank) a.push('忽略空行'); if (o.ignoreTerm) a.push('忽略結尾 ; /');
  return a.length ? '選項：' + a.join('、') : '選項：完全比對';
}

/* ---------- 差異導覽 ---------- */
function markCurrent() {
  document.querySelectorAll('#diffTable tr.cur').forEach(tr => tr.classList.remove('cur'));
  const bl = state.res ? state.res.blocks : [];
  $('navPos').textContent = `${state.cur >= 0 ? state.cur + 1 : 0} / ${bl.length}`;
  if (state.cur < 0 || !bl[state.cur]) return;
  const [s, e] = bl[state.cur];
  for (let i = s; i <= e; i++) { const tr = $('r' + i); if (tr) { tr.classList.add('cur'); if (tr.nextElementSibling && !tr.nextElementSibling.id && state.view === 'inline' && state.res.rows[i].t === 'mod') tr.nextElementSibling.classList.add('cur'); } }
}
function goto(n) {
  const bl = state.res && state.res.blocks; if (!bl || !bl.length) return;
  if (state.tab !== 'diff') setTab('diff');
  state.cur = (n + bl.length) % bl.length;
  markCurrent();
  const tr = $('r' + bl[state.cur][0]);
  if (tr) { const sc = $('resultScroll'); sc.scrollTop = tr.offsetTop - sc.clientHeight / 3; }
}

/* ---------- 結構差異摘要 ---------- */
function sumCounts(S) {
  return {
    mod: S.secs.filter(s => s.st === 'mod').length, add: S.secs.filter(s => s.st === 'add').length, del: S.secs.filter(s => s.st === 'del').length,
    warn: S.secs.reduce((n, s) => n + s.items.filter(i => i.k === 'warn' || i.nw).length, 0)
  };
}
function summaryHtml(S, interactive) {
  const E = escHtml, res = state.res, c = sumCounts(S);
  const card = (l, v, cls) => `<div class="sum-card ${cls || ''}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const loc = (side, ln) => ln == null || ln < 0 ? '' : ` data-side="${side}" data-ln="${ln}"`;
  const cut = (t, n = 400) => { t = t == null ? '' : String(t); return t.length > n ? t.slice(0, n) + ' …' : t; };
  const h = ['<div class="sum">'];
  h.push('<div class="sum-ov">' + card('敘述數（舊 → 新）', `${S.nA} → ${S.nB}`) + card('結構相同', S.same, 'eq') + card('有變更', c.mod, 'mod') +
    card('新增敘述', c.add, 'add') + card('刪除敘述', c.del, 'del') + card('需注意', c.warn, 'warn') + '</div>');
  if (!S.secs.length) h.push(`<div class="sum-none">✔ 未發現 SQL 結構差異${res.blocks.length ? '（差異僅在註解、格式或未納入解析的內容，請參閱逐行差異）' : ''}</div>`);
  const ST = { mod: '變更', add: '新增', del: '刪除', oth: '其他' }, MK = { add: '+', del: '−', mod: '~', info: 'ℹ', warn: '⚠' };
  for (const sec of S.secs) {
    const la = sec.a ? sec.a.ln : null, lb = sec.b ? sec.b.ln : null;
    h.push(`<div class="sec ${sec.st}"><div class="sec-hd"><span class="badge ${sec.st}">${ST[sec.st]}</span><span class="lbl" title="${E(sec.label)}">${E(sec.label)}</span>`);
    if (la != null) h.push(`<span class="loc"${interactive ? loc('A', la) : ''}>舊 L${la + 1}${sec.a.lnEnd > la ? '–' + (sec.a.lnEnd + 1) : ''}</span>`);
    if (lb != null) h.push(`<span class="loc"${interactive ? loc('B', lb) : ''}>新 L${lb + 1}${sec.b.lnEnd > lb ? '–' + (sec.b.lnEnd + 1) : ''}</span>`);
    h.push('</div>');
    if (sec.st === 'add' || sec.st === 'del') {
      const s0 = sec.a || sec.b, lines = (sec.a ? res.A : res.B).lines.slice(s0.ln, s0.lnEnd + 1);
      h.push(`<pre class="sum-code">${E(lines.slice(0, 15).join('\n'))}${lines.length > 15 ? `\n… 其餘 ${lines.length - 15} 行` : ''}</pre>`);
    }
    if (sec.items.length) {
      h.push('<table class="sumt"><colgroup><col style="width:210px"><col style="width:28px"><col><col></colgroup><tr><th>類別</th><th></th><th>舊版</th><th>新版</th></tr>');
      for (const it of sec.items) {
        const where = it.lb != null && it.lb >= 0 ? loc('B', it.lb) : it.la != null && it.la >= 0 ? loc('A', it.la) : '';
        const note = it.note ? `<div class="note${it.nw ? ' w' : ''}">${it.nw ? '⚠ ' : ''}${E(it.note)}</div>` : '';
        const tr = `<tr class="k-${it.k}${interactive && where ? ' jump' : ''}"${interactive ? where : ''}${interactive && where ? ' title="點擊跳至逐行差異"' : ''}><td class="c">${E(it.cat)}</td><td class="k">${MK[it.k]}</td>`;
        if (it.k === 'info' || it.k === 'warn') h.push(`${tr}<td class="t" colspan="2">${E(it.text)}${note}</td></tr>`);
        else if (it.k === 'add') h.push(`${tr}<td class="a"></td><td class="b">${E(cut(it.b))}${note}</td></tr>`);
        else if (it.k === 'del') h.push(`${tr}<td class="a">${E(cut(it.a))}${note}</td><td class="b"></td></tr>`);
        else h.push(`${tr}<td class="a">${E(cut(it.a))}</td><td class="b">${E(cut(it.b))}${note}</td></tr>`);
      }
      h.push('</table>');
    }
    h.push('</div>');
  }
  h.push('</div>');
  return h.join('');
}
function renderSummary() {
  const res = state.res, el = $('summaryBody'), bd = $('sumBadge');
  if (!res.sum) { el.innerHTML = `<div class="sum"><div class="sum-none" style="color:#696969">結構解析失敗：${escHtml(res.sumErr || '未知錯誤')}（逐行差異不受影響）</div></div>`; bd.textContent = '!'; bd.className = 'bdg'; return; }
  el.innerHTML = summaryHtml(res.sum, true);
  const c = sumCounts(res.sum), n = c.mod + c.add + c.del + (res.sum.secs.some(s => s.st === 'oth') ? 1 : 0);
  bd.textContent = n; bd.className = 'bdg' + (n ? '' : ' zero');
  bd.title = `變更 ${c.mod}、新增 ${c.add}、刪除 ${c.del}、需注意 ${c.warn}`;
}
function applyTab() {
  const sum = state.tab === 'sum', res = state.res;
  $('tabDiff').classList.toggle('on', !sum); $('tabSum').classList.toggle('on', sum);
  $('resultBody').style.display = sum ? 'none' : '';
  $('summaryBody').style.display = sum ? 'block' : 'none';
  $('identical').style.display = !sum && res && !res.blocks.length ? 'block' : 'none';
}
function setTab(t) { state.tab = t; applyTab(); saveOpts(); $('resultScroll').scrollTop = 0; if (t === 'diff' && state.cur >= 0) { const bl = state.res.blocks[state.cur]; const tr = bl && $('r' + bl[0]); if (tr) $('resultScroll').scrollTop = tr.offsetTop - $('resultScroll').clientHeight / 3; } }
function jumpTo(side, ln) {
  const rows = state.res.rows;
  let idx = rows.findIndex(r => (side === 'A' ? r.l : r.r) === ln);
  if (idx < 0) idx = rows.findIndex(r => (side === 'A' ? r.l : r.r) > ln);
  if (idx < 0) return;
  state.tab = 'diff';
  if (state.foldOf.has(idx)) { state.expanded.add(state.foldOf.get(idx)); render(); }
  applyTab(); saveOpts();
  const bi = state.res.blocks.findIndex(([s, e]) => idx >= s && idx <= e);
  if (bi >= 0) { state.cur = bi; markCurrent(); }
  const tr = $('r' + idx); if (!tr) return;
  const sc = $('resultScroll'); sc.scrollTop = tr.offsetTop - sc.clientHeight / 3;
  tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
}
async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); }
  catch { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg);
}

/* ---------- 匯出 ---------- */
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function exportHtml() {
  const s = state.res.stats;
  const nA = state.names.A || '舊版（貼上內容）', nB = state.names.B || '新版（貼上內容）';
  const tbl = $('diffTable') ? $('diffTable').outerHTML.replace(/\s(cur|flash)\b/g, '').replace(/ class="(cur|flash)"/g, '') : '';
  const doc = `<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="UTF-8"><title>SQL 差異報表 ${escHtml(nA)} vs ${escHtml(nB)}</title>
<style>:root{--theme-font-sans:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;--theme-font-mono:"Cascadia Mono",Consolas,"SFMono-Regular",monospace}body{font-family:var(--theme-font-sans);margin:20px;color:#2f2f2f;background:#f4f4f4}h1{font-size:20px;color:#616161}h2{font-size:16px;margin:22px 0 0;color:#505050}table.meta td{padding:2px 12px 2px 0;font-size:14px}.wrapd{border:1px solid #d1d1d1;border-radius:6px;overflow:hidden;margin-top:14px}${DIFF_CSS}.diff-theme{background:#fefefe;color:#2f2f2f}.wrapd tr.del td.cl,.wrapd tr.mod td.cl{background:#e8e8e8}.wrapd tr.add td.cr,.wrapd tr.mod td.cr{background:#e9e9e9}</style></head><body>
<h1>Oracle SQL 差異報表</h1>
<table class="meta">
<tr><td>舊版</td><td>${escHtml(nA)}（${s.linesA} 行）</td></tr>
<tr><td>新版</td><td>${escHtml(nB)}（${s.linesB} 行）</td></tr>
<tr><td>比對結果</td><td>新增 ${s.add} 行、刪除 ${s.del} 行、修改 ${s.mod} 行、搬移 ${s.move} 行、忽略 ${s.skip} 行，共 ${state.res.blocks.length} 處差異</td></tr>
<tr><td>比對選項</td><td>${escHtml(optText(opts()).replace('選項：', ''))}</td></tr>
<tr><td>產出時間</td><td>${new Date().toLocaleString('zh-TW')}</td></tr>
</table>
<h2>一、SQL 結構差異摘要</h2>
<div class="wrapd">${state.res.sum ? summaryHtml(state.res.sum, false) : '<p style="padding:20px">結構解析失敗：' + escHtml(state.res.sumErr) + '</p>'}</div>
<h2>二、逐行差異</h2>
<div class="wrapd">${state.res.blocks.length ? tbl : '<p style="padding:20px">依比對選項，兩邊內容完全相同。</p>'}</div>
</body></html>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([doc], { type: 'text/html;charset=utf-8' }));
  a.download = `SQL_Compare_${stamp()}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('已匯出 HTML 報表');
}
async function copyUnified() {
  const txt = unifiedText(state.res, state.names.A || 'old.sql', state.names.B || 'new.sql');
  try { await navigator.clipboard.writeText(txt); }
  catch { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('已複製差異內容');
}

/* ---------- 範例 ---------- */
const SAMPLE_A = `-- 客戶餘額查詢（舊版）
SELECT A.CUSTID,
       A.NAME,
       B.BALANCE
  FROM CM_CUSTOMER A,
       CM_ACCOUNT  B
 WHERE A.CUSTID = B.CUSTID
   AND A.DATA_DT = '11508'
   AND B.STATUS IN ('01','02')
 ORDER BY A.CUSTID;
/`;
const SAMPLE_B = `/* 客戶餘額查詢（新版）
   修改：改用 ANSI JOIN、期別參數化 */
select a.custid,
       a.name,
       b.cur_balance,
       b.ccy
  from cm_customer a
  LEFT JOIN cm_account b
    ON a.custid = b.custid
 where a.data_dt = :P_PERIOD
   and b.status in ('01','02')
 order by a.custid`;

/* ---------- 事件 ---------- */
$('btnCompare').onclick = runCompare;
$('btnEdit').onclick = showEdit;
$('btnSwap').onclick = () => {
  [$('txtA').value, $('txtB').value] = [$('txtB').value, $('txtA').value];
  [state.names.A, state.names.B] = [state.names.B, state.names.A];
  [$('nameA').textContent, $('nameB').textContent] = [$('nameB').textContent, $('nameA').textContent];
  updateCount('A'); updateCount('B');
  if ($('resultView').style.display === 'flex') runCompare();
};
$('btnClear').onclick = () => {
  for (const s of ['A', 'B']) { $('txt' + s).value = ''; state.names[s] = ''; $('name' + s).textContent = '（貼上 SQL 或拖放檔案）'; updateCount(s); }
  state.res = null; showEdit(); $('stats').textContent = '尚未比對'; $('navPos').textContent = '0 / 0';
  for (const b of ['btnCopy', 'btnExport', 'btnPrev', 'btnNext', 'btnCopySum']) $(b).disabled = true;
};
$('btnSample').onclick = () => {
  $('txtA').value = SAMPLE_A; $('txtB').value = SAMPLE_B;
  state.names.A = 'cust_balance_v1.sql'; state.names.B = 'cust_balance_v2.sql';
  $('nameA').textContent = state.names.A + '（範例）'; $('nameB').textContent = state.names.B + '（範例）';
  updateCount('A'); updateCount('B'); showEdit();
};
$('btnPrev').onclick = () => goto(state.cur - 1);
$('btnNext').onclick = () => goto(state.cur + 1);
$('btnExport').onclick = exportHtml;
$('btnCopy').onclick = copyUnified;
$('btnCopySum').onclick = () => { if (state.res && state.res.sum) copyText(summaryText(state.res.sum, state.names.A || '舊版（貼上內容）', state.names.B || '新版（貼上內容）'), '已複製結構摘要'); };
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { if (state.res) setTab(b.dataset.tab); }));
$('summaryBody').addEventListener('click', e => {
  const el = e.target.closest('[data-ln]'); if (!el) return;
  jumpTo(el.dataset.side, +el.dataset.ln);
});
$('resultBody').addEventListener('click', e => {
  const tr = e.target.closest('tr.fold'); if (!tr) return;
  state.expanded.add(+tr.dataset.fold); render();
});
['optCase', 'optWS', 'optComment', 'optBlank', 'optTerm'].forEach(id => $(id).addEventListener('change', () => { saveOpts(); if (state.res && $('resultView').style.display === 'flex') runCompare(); }));
['optOnlyDiff', 'optWrap'].forEach(id => $(id).addEventListener('change', () => { saveOpts(); state.expanded.clear(); render(); }));
document.querySelectorAll('input[name=view]').forEach(r => r.addEventListener('change', () => { state.view = r.value; saveOpts(); render(); if (state.cur >= 0) goto(state.cur); }));
$('optEnc').addEventListener('change', saveOpts);
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runCompare(); }
  else if (e.key === 'F7') { e.preventDefault(); goto(state.cur + (e.shiftKey ? -1 : 1)); }
  else if (e.key === 'Escape' && $('resultView').style.display === 'flex') showEdit();
  else if (e.altKey && (e.key === '1' || e.key === '2') && state.res && $('resultView').style.display === 'flex') { e.preventDefault(); setTab(e.key === '1' ? 'diff' : 'sum'); }
});

/* ---------- 設定保存 ---------- */
const OPT_IDS = ['optCase', 'optWS', 'optComment', 'optBlank', 'optTerm', 'optOnlyDiff', 'optWrap'];
function saveOpts() {
  try {
    const o = {}; OPT_IDS.forEach(id => o[id] = $(id).checked); o.view = state.view; o.enc = $('optEnc').value; o.tab = state.tab;
    localStorage.setItem('sqlCompareOpts', JSON.stringify(o));
  } catch { }
}
(function loadOpts() {
  try {
    const o = JSON.parse(localStorage.getItem('sqlCompareOpts') || 'null'); if (!o) return;
    OPT_IDS.forEach(id => { if (id in o) $(id).checked = o[id]; });
    if (o.view) { state.view = o.view; document.querySelector(`input[name=view][value=${o.view}]`).checked = true; }
    if (o.enc) $('optEnc').value = o.enc;
    if (o.tab) state.tab = o.tab;
  } catch { }
})();
</script>
